    </linearGradient>
    <symbol id="mo" viewBox="-50 -50 100 100"><path d="M0,32 C-46,-8 -32,-52 0,-22 C32,-52 46,-8 0,32 Z"/></symbol>
  </defs>

  <g filter="url(#sh)">
