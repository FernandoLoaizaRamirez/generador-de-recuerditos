  <path d="M600,396 Q690,392.6 776,396 Q690,399.4 600,396 Z" fill="url(#rule)"/>
  <path d="M1048,396 Q958,392.6 872,396 Q958,399.4 1048,396 Z" fill="url(#rule)"/>
  <use href="#mo" x="-50" y="-50" width="100" height="100"
