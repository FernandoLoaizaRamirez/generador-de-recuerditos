<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 3 / flores traseras (fuera de foco).
    Truco de profundidad: en vez de dibujar rosas nítidas y desenfocarlas con
    un filtro (caro), se dibujan rosas INTRÍNSECAMENTE suaves — masas de
    gradiente radial con alfa — que es justo como se comporta un plano trasero
    desenfocado. Contraste bajo y saturación baja para que retrocedan.
    Recorren la diagonal superior-derecha -> inferior-izquierda.
  -->
  <defs>
    <radialGradient id="fbRoseA" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fdeae6" stop-opacity="0.92" />
      <stop offset="46%" stop-color="#f2cfcb" stop-opacity="0.72" />
      <stop offset="78%" stop-color="#e3b3b2" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#dcaaa9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fbRoseB" cx="45%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#fffaf2" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#f7e6d8" stop-opacity="0.66" />
      <stop offset="80%" stop-color="#eccfc0" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#e7c6b8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9a6a4" stop-opacity="0.50" />
      <stop offset="70%" stop-color="#e0b0ad" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e5b8b5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fbLeaf" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#c4d1b6" stop-opacity="0.68" />
      <stop offset="62%" stop-color="#a9bb9c" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#9aad8c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fbGoldLeaf" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#eed9a8" stop-opacity="0.58" />
      <stop offset="66%" stop-color="#d8bc80" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#cbab6e" stop-opacity="0" />
    </radialGradient>

    <!-- Rosa desenfocada: masa exterior + insinuación de pétalos + corazón -->
    <symbol id="fbRose" viewBox="-100 -100 200 200">
      <ellipse cx="0" cy="0" rx="98" ry="92" fill="url(#fbRoseA)" />
      <ellipse cx="-34" cy="-28" rx="54" ry="48" fill="url(#fbRoseB)" />
      <ellipse cx="36" cy="-18" rx="46" ry="42" fill="url(#fbRoseB)" opacity="0.8" />
      <ellipse cx="6" cy="38" rx="50" ry="40" fill="url(#fbRoseA)" opacity="0.85" />
      <ellipse cx="-2" cy="4" rx="30" ry="27" fill="url(#fbCore)" />
    </symbol>

    <!-- Rosa clara (champagne) -->
    <symbol id="fbRoseLight" viewBox="-100 -100 200 200">
      <ellipse cx="0" cy="0" rx="96" ry="90" fill="url(#fbRoseB)" />
      <ellipse cx="-30" cy="-30" rx="50" ry="44" fill="url(#fbRoseB)" />
      <ellipse cx="34" cy="16" rx="44" ry="40" fill="url(#fbRoseA)" opacity="0.7" />
      <ellipse cx="0" cy="0" rx="26" ry="24" fill="url(#fbCore)" opacity="0.7" />
    </symbol>

    <symbol id="fbLeafShape" viewBox="-100 -40 200 80">
      <ellipse cx="0" cy="0" rx="96" ry="34" fill="url(#fbLeaf)" />
    </symbol>
    <symbol id="fbLeafGold" viewBox="-100 -40 200 80">
      <ellipse cx="0" cy="0" rx="96" ry="30" fill="url(#fbGoldLeaf)" />
    </symbol>
  </defs>

  <!-- ============ Racimo superior derecho ============ -->
  <g>
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(1092,86) rotate(-34) scale(1.5)" />
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(946,196) rotate(22) scale(1.25)" />
    <use href="#fbLeafGold" x="-100" y="-40" width="200" height="80"
         transform="translate(1148,268) rotate(58) scale(1.3)" />
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(1024,352) rotate(-12) scale(1.1)" />

    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(1108,142) scale(1.42)" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(922,96) scale(0.98)" />
    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(1168,346) scale(1.05)" opacity="0.9" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(986,300) scale(0.72)" opacity="0.85" />
    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(872,214) scale(0.6)" opacity="0.75" />
  </g>

  <!-- ============ Caída por el costado derecho ============ -->
  <g opacity="0.9">
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(1160,516) rotate(74) scale(1.2)" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(1176,470) scale(0.78)" />
    <use href="#fbLeafGold" x="-100" y="-40" width="200" height="80"
         transform="translate(1186,660) rotate(96) scale(1.0)" />
  </g>

  <!-- ============ Acento izquierdo alto ============ -->
  <g opacity="0.85">
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(40,392) rotate(-58) scale(1.15)" />
    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(24,470) scale(0.86)" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(76,340) scale(0.5)" />
  </g>

  <!-- ============ Racimo inferior izquierdo (cierra la diagonal) ============ -->
  <g>
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(96,1108) rotate(38) scale(1.45)" />
    <use href="#fbLeafGold" x="-100" y="-40" width="200" height="80"
         transform="translate(196,1252) rotate(-26) scale(1.2)" />
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(30,1330) rotate(66) scale(1.25)" />

    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(74,1198) scale(1.32)" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(218,1140) scale(0.84)" />
    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(150,1336) scale(0.9)" opacity="0.9" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(20,1420) scale(0.62)" opacity="0.8" />
  </g>

  <!-- ============ Acento inferior derecho (equilibra el pie) ============ -->
  <g opacity="0.88">
    <use href="#fbLeafShape" x="-100" y="-40" width="200" height="80"
         transform="translate(1132,1552) rotate(-42) scale(1.2)" />
    <use href="#fbRose" x="-100" y="-100" width="200" height="200"
         transform="translate(1164,1636) scale(1.0)" />
    <use href="#fbRoseLight" x="-100" y="-100" width="200" height="200"
         transform="translate(1064,1720) scale(0.66)" />
    <use href="#fbLeafGold" x="-100" y="-40" width="200" height="80"
         transform="translate(1010,1620) rotate(28) scale(0.95)" />
  </g>
</svg>
