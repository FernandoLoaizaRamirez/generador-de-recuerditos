<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 4 / oro trasero: halo, arabescos y las mariposas del plano de atrás.
    Va DEBAJO de las fotos, así que estos elementos asoman por los bordes y
    generan la sensación de que las fotos están apoyadas encima de algo.
    Los arabescos son de trazo afilado (formas rellenas con punta, no strokes
    de grosor constante) para que no se lean como clipart vectorial.
  -->
  <defs>
    <linearGradient id="haloFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e3ac" stop-opacity="0.62" />
      <stop offset="34%" stop-color="#dcb96a" stop-opacity="0.40" />
      <stop offset="68%" stop-color="#c9a455" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#b8913f" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="haloFade2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d2" stop-opacity="0.48" />
      <stop offset="52%" stop-color="#e3c37a" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#cfa85f" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="scrollGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7dd" />
      <stop offset="18%" stop-color="#eed8a0" />
      <stop offset="38%" stop-color="#d5b263" />
      <stop offset="52%" stop-color="#fffbe9" />
      <stop offset="66%" stop-color="#c19a4c" />
      <stop offset="84%" stop-color="#96702a" />
      <stop offset="100%" stop-color="#e2c481" />
    </linearGradient>

    <radialGradient id="pearlBack" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#fffdf2" />
      <stop offset="46%" stop-color="#f0e0bd" />
      <stop offset="100%" stop-color="#c4a55f" />
    </radialGradient>

    <!-- Mariposa trasera: tonos apagados, va en sombra -->
    <radialGradient id="bwUpper" cx="12%" cy="76%" r="96%">
      <stop offset="0%" stop-color="#d9a9ae" stop-opacity="0.88" />
      <stop offset="52%" stop-color="#e6bfc0" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#f0d6cf" stop-opacity="0.34" />
    </radialGradient>
    <radialGradient id="bwLower" cx="14%" cy="16%" r="96%">
      <stop offset="0%" stop-color="#cf9ba3" stop-opacity="0.86" />
      <stop offset="60%" stop-color="#dfb2b3" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#ecd0c9" stop-opacity="0.28" />
    </radialGradient>

    <!--
      Filigrana. Va de TRAZO FINO, no de formas rellenas: una voluta rellena
      del tamaño de estas se empasta y se lee como una mancha de oro. Con
      stroke de 2-3.5 px sobre un recorrido de ~300 px la proporción es de
      ~1:100 y sí lee como filigrana de papelería.
    -->
    <symbol id="flourish" viewBox="-30 -20 340 200">
      <g fill="none" stroke="url(#scrollGold)" stroke-linecap="round">
        <path d="M300,14 C246,26 190,52 140,86 C104,110 68,134 34,150"
              stroke-width="3.4" />
        <path d="M34,150 C14,158 2,150 4,138 C6,127 18,122 26,128
                 C33,133 32,144 24,146" stroke-width="3" />
        <path d="M140,86 C138,60 152,38 178,28" stroke-width="2.4" />
        <path d="M178,28 C192,22 206,26 208,38 C210,48 200,54 194,48"
              stroke-width="2.2" />
        <path d="M96,116 C92,142 100,164 118,176" stroke-width="2.2" />
        <path d="M118,176 C130,184 144,180 146,168 C148,158 138,152 132,158"
              stroke-width="2" />
        <path d="M220,44 C244,36 268,34 292,38" stroke-width="1.8" />
      </g>
      <g fill="url(#scrollGold)">
        <path d="M190,60 C202,48 218,44 230,46 C218,56 204,64 192,68 Z" />
        <path d="M70,132 C64,146 66,160 74,168 C74,154 74,142 78,132 Z" />
        <path d="M250,26 C262,18 276,16 286,18 C274,26 262,32 252,34 Z" />
      </g>
      <g fill="url(#pearlBack)">
        <circle cx="300" cy="14" r="3.6" />
        <circle cx="208" cy="38" r="2.8" />
        <circle cx="146" cy="168" r="2.6" />
      </g>
    </symbol>

    <symbol id="backButterfly" viewBox="-110 -110 220 220">
      <g>
        <g>
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#bwUpper)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#bwLower)" />
          <g stroke="#b98a90" stroke-width="1.2" opacity="0.5" fill="none">
            <path d="M8,-16 C36,-30 62,-46 84,-58" />
            <path d="M8,-24 C34,-46 56,-62 74,-74" />
            <path d="M10,22 C34,30 52,44 60,58" />
          </g>
          <path d="M4,-38 C34,-96 96,-92 96,-44" fill="none" stroke="#d9b871"
                stroke-width="2" opacity="0.62" />
        </g>
        <g transform="scale(-1,1)">
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#bwUpper)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#bwLower)" />
          <g stroke="#b98a90" stroke-width="1.2" opacity="0.5" fill="none">
            <path d="M8,-16 C36,-30 62,-46 84,-58" />
            <path d="M8,-24 C34,-46 56,-62 74,-74" />
            <path d="M10,22 C34,30 52,44 60,58" />
          </g>
          <path d="M4,-38 C34,-96 96,-92 96,-44" fill="none" stroke="#d9b871"
                stroke-width="2" opacity="0.62" />
        </g>
        <path d="M0,-48 C7,-41 8,-10 6,26 C5,52 2,68 0,76 C-2,68 -5,52 -6,26
                 C-8,-10 -7,-41 0,-48 Z" fill="#8d6a52" opacity="0.75" />
        <g stroke="#8d6a52" stroke-width="1.8" fill="none" opacity="0.6">
          <path d="M-2,-46 C-12,-64 -28,-76 -44,-82" />
          <path d="M2,-46 C12,-64 28,-76 44,-82" />
        </g>
      </g>
    </symbol>
  </defs>

  <!-- Halo: círculo de luz dorada detrás del racimo de fotos -->
  <circle cx="600" cy="600" r="556" fill="none" stroke="url(#haloFade)" stroke-width="6" />
  <circle cx="600" cy="600" r="524" fill="none" stroke="url(#haloFade)" stroke-width="1.8"
          opacity="0.7" />
  <circle cx="612" cy="620" r="596" fill="none" stroke="url(#haloFade2)" stroke-width="2.4"
          opacity="0.55" />

  <!--
    Arabescos: solo DOS, en esquinas opuestas, para acompañar la diagonal del
    ramo sin competir con él. Antes había cinco y se amontonaban.
  -->
  <use href="#flourish" x="-30" y="-20" width="340" height="200"
       transform="translate(1178,62) rotate(150) scale(1.02)" opacity="0.82" />
  <use href="#flourish" x="-30" y="-20" width="340" height="200"
       transform="translate(22,1524) rotate(-22) scale(0.94)" opacity="0.78" />

  <!-- Mariposas del plano trasero: asoman por detrás de las fotos -->
  <use href="#backButterfly" x="-110" y="-110" width="220" height="220"
       transform="translate(778,236) rotate(-18) scale(0.62)" />
  <use href="#backButterfly" x="-110" y="-110" width="220" height="220"
       transform="translate(322,986) rotate(14) scale(0.5)" />
  <use href="#backButterfly" x="-110" y="-110" width="220" height="220"
       transform="translate(1114,760) rotate(28) scale(0.4)" opacity="0.8" />
</svg>
