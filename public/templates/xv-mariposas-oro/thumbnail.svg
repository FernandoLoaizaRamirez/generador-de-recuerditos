<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="400" height="600">
  <!--
    Miniatura de galería. Mismo viewBox 1200x1800 que la plantilla, así que
    marcos, retrato y textos caen donde el .ts dice. Se muestran las DOS
    mitades al derecho, igual que en el editor: el giro de 180° de la mitad
    superior solo ocurre al exportar.
  -->
  <defs>
    <linearGradient id="mtTop" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fef4f6" /><stop offset="40%" stop-color="#fbe0e7" />
      <stop offset="100%" stop-color="#eeb8c8" />
    </linearGradient>
    <linearGradient id="mtBot" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fbf1e6" /><stop offset="100%" stop-color="#f0ddcd" />
    </linearGradient>
    <linearGradient id="mtPaper" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fffdf9" /><stop offset="100%" stop-color="#f6ebdc" />
    </linearGradient>
    <radialGradient id="mtSlot" cx="42%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#f6e2dc" /><stop offset="100%" stop-color="#ddb1ae" />
    </radialGradient>
    <linearGradient id="mtLitT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a17629" /><stop offset="20%" stop-color="#fff8e0" />
      <stop offset="48%" stop-color="#d2ae5f" /><stop offset="74%" stop-color="#8e6a26" />
      <stop offset="100%" stop-color="#f3e2ab" />
    </linearGradient>
    <linearGradient id="mtLitL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a17629" /><stop offset="21%" stop-color="#fdf3d6" />
      <stop offset="49%" stop-color="#cba85a" /><stop offset="75%" stop-color="#8a6624" />
      <stop offset="100%" stop-color="#eddca4" />
    </linearGradient>
    <linearGradient id="mtShdB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7d5719" /><stop offset="24%" stop-color="#d9bd75" />
      <stop offset="58%" stop-color="#916c26" /><stop offset="100%" stop-color="#dcc287" />
    </linearGradient>
    <linearGradient id="mtShdR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#825c1c" /><stop offset="24%" stop-color="#dec27b" />
      <stop offset="58%" stop-color="#957028" /><stop offset="100%" stop-color="#e0c68c" />
    </linearGradient>
    <linearGradient id="mtGold" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff8e2" /><stop offset="40%" stop-color="#d3ae5c" />
      <stop offset="56%" stop-color="#fffbe9" /><stop offset="86%" stop-color="#8d6825" />
      <stop offset="100%" stop-color="#e4c785" />
    </linearGradient>
    <linearGradient id="mtPt" x1="0" y1="1" x2="0.15" y2="0">
      <stop offset="0%" stop-color="#c9868c" /><stop offset="58%" stop-color="#f0c6c2" />
      <stop offset="100%" stop-color="#fdf1ec" />
    </linearGradient>
    <radialGradient id="mtWing" cx="10%" cy="80%" r="104%">
      <stop offset="0%" stop-color="#c9727f" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#e8b08f" stop-opacity="0.84" />
      <stop offset="100%" stop-color="#f7e2b0" stop-opacity="0.46" />
    </radialGradient>

    <path id="mp" d="M0,4 C-26,-10 -40,-44 -26,-74 C-16,-95 16,-95 26,-74
                     C40,-44 26,-10 0,4 Z" />
    <symbol id="mRose" viewBox="-100 -100 200 200">
      <g fill="url(#mtPt)">
        <use href="#mp" transform="rotate(6)" /><use href="#mp" transform="rotate(66)" />
        <use href="#mp" transform="rotate(126)" /><use href="#mp" transform="rotate(186)" />
        <use href="#mp" transform="rotate(246)" /><use href="#mp" transform="rotate(306)" />
      </g>
      <g fill="url(#mtPt)">
        <use href="#mp" transform="rotate(36) scale(0.66)" />
        <use href="#mp" transform="rotate(108) scale(0.66)" />
        <use href="#mp" transform="rotate(180) scale(0.66)" />
        <use href="#mp" transform="rotate(252) scale(0.66)" />
        <use href="#mp" transform="rotate(324) scale(0.66)" />
      </g>
      <circle r="12" fill="#d99a9d" />
    </symbol>
    <symbol id="mBf" viewBox="-115 -110 230 220">
      <g>
        <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#mtWing)" />
        <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#mtWing)" />
        <g transform="scale(-1,1)">
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#mtWing)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#mtWing)" />
        </g>
        <path d="M0,-48 C7,-41 8,-10 6,26 C5,52 2,68 0,76 C-2,68 -5,52 -6,26
                 C-8,-10 -7,-41 0,-48 Z" fill="#9a7433" />
      </g>
    </symbol>
  </defs>

  <!-- ===================== MITAD SUPERIOR ===================== -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#mtTop)" />
  <g opacity="0.5">
    <use href="#mRose" x="-100" y="-100" width="200" height="200" transform="translate(1112,124) scale(1.24)" />
    <use href="#mRose" x="-100" y="-100" width="200" height="200" transform="translate(66,706) scale(1.16)" />
  </g>

  <g transform="translate(75,95) rotate(-4)">
    <rect width="505" height="395" fill="url(#mtSlot)" />
    <path d="M-20,-20 L525,-20 L505,0 L0,0 Z" fill="url(#mtLitT)" />
    <path d="M-20,-20 L0,0 L0,395 L-20,415 Z" fill="url(#mtLitL)" />
    <path d="M525,-20 L525,415 L505,395 L505,0 Z" fill="url(#mtShdR)" />
    <path d="M525,415 L-20,415 L0,395 L505,395 Z" fill="url(#mtShdB)" />
  </g>
  <g transform="translate(640,420) rotate(5)">
    <rect width="490" height="390" fill="url(#mtSlot)" />
    <path d="M-20,-20 L510,-20 L490,0 L0,0 Z" fill="url(#mtLitT)" />
    <path d="M-20,-20 L0,0 L0,390 L-20,410 Z" fill="url(#mtLitL)" />
    <path d="M510,-20 L510,410 L490,390 L490,0 Z" fill="url(#mtShdR)" />
    <path d="M510,410 L-20,410 L0,390 L490,390 Z" fill="url(#mtShdB)" />
  </g>

  <use href="#mRose" x="-100" y="-100" width="200" height="200" transform="translate(62,84) scale(0.72)" />
  <use href="#mRose" x="-100" y="-100" width="200" height="200" transform="translate(618,432) rotate(10) scale(0.6)" />
  <use href="#mBf" x="-115" y="-110" width="230" height="220" transform="translate(596,258) rotate(-24) scale(0.78)" />
  <use href="#mBf" x="-115" y="-110" width="230" height="220" transform="translate(160,626) rotate(-14) scale(0.42)" />

  <!-- «Mis XV» sugerido (el texto real lo dibuja Konva) -->
  <path d="M700,120 C728,74 752,72 758,104 C763,130 745,142 736,129
           C728,117 743,96 767,93 C805,88 826,114 838,126
           C851,138 868,127 873,104 C879,76 902,71 912,94
           C921,113 908,131 897,124 C886,117 895,95 918,91
           C948,86 970,112 984,126"
        fill="none" stroke="#c8a24e" stroke-width="9" stroke-linecap="round" opacity="0.9" />

  <!-- ===================== MITAD INFERIOR ===================== -->
  <rect x="0" y="900" width="1200" height="900" fill="url(#mtBot)" />
  <g transform="translate(0,900)">
    <rect x="60" y="50" width="1080" height="800" rx="18" fill="url(#mtPaper)" />
    <rect x="60" y="50" width="1080" height="800" rx="18" fill="none"
          stroke="url(#mtGold)" stroke-width="5" />
    <rect x="76" y="66" width="1048" height="768" rx="12" fill="none"
          stroke="url(#mtGold)" stroke-width="1.6" opacity="0.75" />
    <rect x="528" y="96" width="592" height="708" rx="14" fill="#fffdf8" opacity="0.9" />
    <rect x="112" y="112" width="400" height="655" rx="6" fill="url(#mtSlot)" />
    <rect x="112" y="112" width="400" height="655" rx="6" fill="none"
          stroke="url(#mtGold)" stroke-width="7" />
    <use href="#mRose" x="-100" y="-100" width="200" height="200"
         transform="translate(126,118) scale(0.6)" />
    <use href="#mRose" x="-100" y="-100" width="200" height="200"
         transform="translate(506,782) rotate(14) scale(0.44)" />
  </g>

  <!-- Textos sugeridos de la tarjeta -->
  <g opacity="0.92">
    <path d="M596,1120 C626,1074 652,1072 658,1104 C663,1130 645,1142 636,1129
             C628,1117 643,1096 667,1093 C705,1088 726,1114 738,1126
             C751,1138 768,1127 773,1104 C779,1076 802,1071 812,1094
             C821,1113 808,1131 797,1124 C786,1117 795,1095 818,1091
             C848,1086 878,1108 900,1126
             M628,1210 C658,1170 686,1168 692,1198 C697,1222 680,1234 671,1222
             C663,1210 678,1191 702,1188 C740,1183 762,1206 776,1218
             C792,1232 812,1220 818,1198 C824,1174 848,1170 858,1192
             C866,1210 854,1226 844,1220"
          fill="none" stroke="#c8a24e" stroke-width="8" stroke-linecap="round" />
    <path d="M600,1248 Q690,1244.6 776,1248 Q690,1251.4 600,1248 Z" fill="url(#mtGold)" opacity="0.85" />
    <path d="M1048,1248 Q958,1244.6 872,1248 Q958,1251.4 1048,1248 Z" fill="url(#mtGold)" opacity="0.85" />
    <rect x="742" y="1278" width="164" height="12" rx="6" fill="#8a7355" opacity="0.5" />
    <rect x="640" y="1340" width="368" height="11" rx="5.5" fill="#6f6252" opacity="0.44" />
    <path d="M576,1445 Q684,1441.4 780,1445 Q684,1448.6 576,1445 Z" fill="url(#mtGold)" opacity="0.85" />
    <path d="M1072,1445 Q964,1441.4 868,1445 Q964,1448.6 1072,1445 Z" fill="url(#mtGold)" opacity="0.85" />
    <circle cx="824" cy="1445" r="6" fill="url(#mtGold)" />
    <rect x="620" y="1480" width="408" height="14" rx="7" fill="#9a7434" opacity="0.6" />
    <rect x="700" y="1562" width="248" height="11" rx="5.5" fill="#6b5b45" opacity="0.5" />
  </g>
</svg>
