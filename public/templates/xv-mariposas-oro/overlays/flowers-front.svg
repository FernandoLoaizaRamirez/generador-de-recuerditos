<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 7 / flores delanteras (en foco).
    A diferencia de floral-back.svg, aquí cada pétalo es una forma con su
    propio gradiente base->punta, su nervadura y su brillo satinado: es el
    plano nítido. Los racimos se colocan MONTADOS sobre las esquinas de los
    marcos, de modo que una parte del ramo queda detrás de la foto (capa
    trasera) y otra por delante. Ese solape es lo que da la profundidad.

    Esquinas reales de los marcos (ya calculadas con la rotación aplicada):
      principal   TL(84,166)  TR(763,107)  BL(161,1045) BR(840,986)
      secundaria  TL(671,484) TR(1130,516) BL(631,1067) BR(1090,1099)
  -->
  <defs>
    <linearGradient id="ptBlush" x1="0" y1="1" x2="0.15" y2="0">
      <stop offset="0%" stop-color="#c9868c" />
      <stop offset="26%" stop-color="#dfa2a4" />
      <stop offset="58%" stop-color="#f0c6c2" />
      <stop offset="84%" stop-color="#fae0d9" />
      <stop offset="100%" stop-color="#fdf1ec" />
    </linearGradient>
    <linearGradient id="ptCream" x1="0" y1="1" x2="0.15" y2="0">
      <stop offset="0%" stop-color="#dcc0a4" />
      <stop offset="28%" stop-color="#eed9c4" />
      <stop offset="62%" stop-color="#f9ecdc" />
      <stop offset="100%" stop-color="#fffaf2" />
    </linearGradient>
    <linearGradient id="ptWhite" x1="0" y1="1" x2="0.15" y2="0">
      <stop offset="0%" stop-color="#d9cfc4" />
      <stop offset="30%" stop-color="#efe8df" />
      <stop offset="66%" stop-color="#fbf7f1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="coreBlush" cx="42%" cy="36%" r="66%">
      <stop offset="0%" stop-color="#f7d9cf" />
      <stop offset="52%" stop-color="#d99a9d" />
      <stop offset="100%" stop-color="#b3707a" />
    </radialGradient>
    <radialGradient id="coreCream" cx="42%" cy="36%" r="66%">
      <stop offset="0%" stop-color="#fff6e6" />
      <stop offset="54%" stop-color="#e8cfa8" />
      <stop offset="100%" stop-color="#c2a06e" />
    </radialGradient>
    <linearGradient id="leafSage" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#c3d1b4" />
      <stop offset="42%" stop-color="#a3b795" />
      <stop offset="78%" stop-color="#87a077" />
      <stop offset="100%" stop-color="#6f8862" />
    </linearGradient>
    <linearGradient id="leafSageLit" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#dbe4cf" />
      <stop offset="46%" stop-color="#bccdae" />
      <stop offset="100%" stop-color="#93a982" />
    </linearGradient>

    <filter id="petalDrop" x="-26%" y="-26%" width="154%" height="154%">
      <feDropShadow dx="6" dy="10" stdDeviation="9"
                    flood-color="#6b4438" flood-opacity="0.30" />
    </filter>

    <!-- geometría base reutilizable -->
    <path id="pt" d="M0,4 C-26,-10 -40,-44 -26,-74 C-16,-95 16,-95 26,-74
                     C40,-44 26,-10 0,4 Z" />
    <path id="ptCrease" d="M0,2 C-6,-24 -6,-52 0,-78" />
    <path id="ptShine" d="M-13,-56 C-18,-71 -8,-86 5,-88" />

    <!-- Rosa: 3 coronas de pétalos + corazón enrollado -->
    <symbol id="roseBlush" viewBox="-100 -100 200 200">
      <g fill="url(#ptBlush)">
        <use href="#pt" transform="rotate(6)" />
        <use href="#pt" transform="rotate(66)" />
        <use href="#pt" transform="rotate(126)" />
        <use href="#pt" transform="rotate(186)" />
        <use href="#pt" transform="rotate(246)" />
        <use href="#pt" transform="rotate(306)" />
      </g>
      <g stroke="#b3737b" stroke-width="1.6" fill="none" opacity="0.28">
        <use href="#ptCrease" transform="rotate(6)" />
        <use href="#ptCrease" transform="rotate(126)" />
        <use href="#ptCrease" transform="rotate(246)" />
      </g>
      <g fill="url(#ptBlush)" opacity="0.97">
        <use href="#pt" transform="rotate(36) scale(0.68)" />
        <use href="#pt" transform="rotate(108) scale(0.68)" />
        <use href="#pt" transform="rotate(180) scale(0.68)" />
        <use href="#pt" transform="rotate(252) scale(0.68)" />
        <use href="#pt" transform="rotate(324) scale(0.68)" />
      </g>
      <g fill="url(#ptBlush)">
        <use href="#pt" transform="rotate(20) scale(0.4)" />
        <use href="#pt" transform="rotate(110) scale(0.4)" />
        <use href="#pt" transform="rotate(200) scale(0.4)" />
        <use href="#pt" transform="rotate(290) scale(0.4)" />
      </g>
      <circle r="13" fill="url(#coreBlush)" />
      <path d="M-9,-3 C-4,-12 7,-12 10,-3 C12,4 4,10 -2,7"
            fill="none" stroke="#a9666f" stroke-width="2" opacity="0.55" />
      <g stroke="#fff3ea" stroke-width="2" fill="none" opacity="0.5">
        <use href="#ptShine" transform="rotate(6)" />
        <use href="#ptShine" transform="rotate(306)" />
      </g>
    </symbol>

    <symbol id="roseCream" viewBox="-100 -100 200 200">
      <g fill="url(#ptCream)">
        <use href="#pt" transform="rotate(-8)" />
        <use href="#pt" transform="rotate(52)" />
        <use href="#pt" transform="rotate(112)" />
        <use href="#pt" transform="rotate(172)" />
        <use href="#pt" transform="rotate(232)" />
        <use href="#pt" transform="rotate(292)" />
      </g>
      <g stroke="#c4a67f" stroke-width="1.6" fill="none" opacity="0.26">
        <use href="#ptCrease" transform="rotate(-8)" />
        <use href="#ptCrease" transform="rotate(112)" />
        <use href="#ptCrease" transform="rotate(232)" />
      </g>
      <g fill="url(#ptCream)" opacity="0.97">
        <use href="#pt" transform="rotate(22) scale(0.66)" />
        <use href="#pt" transform="rotate(94) scale(0.66)" />
        <use href="#pt" transform="rotate(166) scale(0.66)" />
        <use href="#pt" transform="rotate(238) scale(0.66)" />
        <use href="#pt" transform="rotate(310) scale(0.66)" />
      </g>
      <g fill="url(#ptCream)">
        <use href="#pt" transform="rotate(8) scale(0.38)" />
        <use href="#pt" transform="rotate(98) scale(0.38)" />
        <use href="#pt" transform="rotate(188) scale(0.38)" />
        <use href="#pt" transform="rotate(278) scale(0.38)" />
      </g>
      <circle r="12" fill="url(#coreCream)" />
      <g stroke="#fffaf0" stroke-width="2" fill="none" opacity="0.5">
        <use href="#ptShine" transform="rotate(-8)" />
        <use href="#ptShine" transform="rotate(292)" />
      </g>
    </symbol>

    <symbol id="roseWhite" viewBox="-100 -100 200 200">
      <g fill="url(#ptWhite)">
        <use href="#pt" transform="rotate(14)" />
        <use href="#pt" transform="rotate(86)" />
        <use href="#pt" transform="rotate(158)" />
        <use href="#pt" transform="rotate(230)" />
        <use href="#pt" transform="rotate(302)" />
      </g>
      <g fill="url(#ptWhite)" opacity="0.96">
        <use href="#pt" transform="rotate(50) scale(0.62)" />
        <use href="#pt" transform="rotate(122) scale(0.62)" />
        <use href="#pt" transform="rotate(194) scale(0.62)" />
        <use href="#pt" transform="rotate(266) scale(0.62)" />
      </g>
      <circle r="11" fill="url(#coreCream)" />
    </symbol>

    <!-- Hoja con nervadura -->
    <symbol id="leaf" viewBox="-100 -46 200 92">
      <path d="M-92,0 C-56,-40 40,-44 92,-4 C40,40 -56,38 -92,0 Z" fill="url(#leafSage)" />
      <path d="M-84,0 C-40,-8 40,-6 84,-3" fill="none" stroke="#6d8760"
            stroke-width="2.4" opacity="0.6" />
      <g stroke="#7c9670" stroke-width="1.5" fill="none" opacity="0.42">
        <path d="M-52,-3 C-42,-16 -26,-22 -12,-24" />
        <path d="M-14,-5 C-4,-18 12,-24 26,-25" />
        <path d="M22,-4 C32,-15 46,-19 58,-19" />
        <path d="M-52,-1 C-44,10 -30,18 -16,21" />
        <path d="M-12,-1 C-4,12 10,20 24,22" />
      </g>
      <path d="M-70,-8 C-30,-30 30,-32 74,-8" fill="none" stroke="#dfe8d4"
            stroke-width="2" opacity="0.4" />
    </symbol>
    <symbol id="leafLit" viewBox="-100 -46 200 92">
      <path d="M-92,0 C-56,-40 40,-44 92,-4 C40,40 -56,38 -92,0 Z" fill="url(#leafSageLit)" />
      <path d="M-84,0 C-40,-8 40,-6 84,-3" fill="none" stroke="#8ea482"
            stroke-width="2.2" opacity="0.55" />
    </symbol>

    <!-- Pétalo suelto (los que "caen" sobre la composición) -->
    <symbol id="loosePetal" viewBox="-40 -50 80 100">
      <use href="#pt" fill="url(#ptBlush)" transform="translate(0,42) scale(0.85)" />
      <use href="#ptCrease" fill="none" stroke="#b3737b" stroke-width="1.4"
           opacity="0.3" transform="translate(0,42) scale(0.85)" />
    </symbol>
  </defs>

  <!-- ============ Racimo 1: esquina superior izquierda del marco principal ============ -->
  <g filter="url(#petalDrop)">
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(52,120) rotate(-38) scale(0.86)" />
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(196,96) rotate(-8) scale(0.72)" />
    <use href="#leafLit" x="-100" y="-46" width="200" height="92"
         transform="translate(36,244) rotate(64) scale(0.78)" />
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(268,142) rotate(22) scale(0.6)" />

    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(104,168) scale(0.92)" />
    <use href="#roseCream" x="-100" y="-100" width="200" height="200"
         transform="translate(228,110) rotate(18) scale(0.66)" />
    <use href="#roseWhite" x="-100" y="-100" width="200" height="200"
         transform="translate(46,272) rotate(-14) scale(0.58)" />
    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(190,232) rotate(28) scale(0.44)" />
    <use href="#roseCream" x="-100" y="-100" width="200" height="200"
         transform="translate(320,86) rotate(-22) scale(0.36)" />
  </g>

  <!-- ============ Racimo 2: costura entre los dos marcos ============ -->
  <g filter="url(#petalDrop)">
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(618,452) rotate(-52) scale(0.7)" />
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(742,438) rotate(12) scale(0.62)" />
    <use href="#leafLit" x="-100" y="-46" width="200" height="92"
         transform="translate(614,596) rotate(74) scale(0.66)" />

    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(672,494) rotate(10) scale(0.72)" />
    <use href="#roseCream" x="-100" y="-100" width="200" height="200"
         transform="translate(772,428) rotate(-16) scale(0.5)" />
    <use href="#roseWhite" x="-100" y="-100" width="200" height="200"
         transform="translate(608,586) rotate(24) scale(0.46)" />
    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(716,566) rotate(-8) scale(0.34)" />
  </g>

  <!-- ============ Racimo 3: esquina inferior izquierda del marco principal ============ -->
  <g filter="url(#petalDrop)">
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(96,1006) rotate(28) scale(0.8)" />
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(258,1074) rotate(-16) scale(0.7)" />
    <use href="#leafLit" x="-100" y="-46" width="200" height="92"
         transform="translate(48,1122) rotate(72) scale(0.64)" />

    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(152,1046) rotate(-10) scale(0.84)" />
    <use href="#roseCream" x="-100" y="-100" width="200" height="200"
         transform="translate(272,1006) rotate(22) scale(0.52)" />
    <use href="#roseWhite" x="-100" y="-100" width="200" height="200"
         transform="translate(64,1136) rotate(16) scale(0.5)" />
    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(252,1122) rotate(-26) scale(0.38)" />
  </g>

  <!-- ============ Racimo 4: esquina inferior derecha del marco secundario ============ -->
  <g filter="url(#petalDrop)">
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(1122,1046) rotate(-32) scale(0.68)" />
    <use href="#leafLit" x="-100" y="-46" width="200" height="92"
         transform="translate(1032,1132) rotate(34) scale(0.58)" />

    <use href="#roseCream" x="-100" y="-100" width="200" height="200"
         transform="translate(1094,1092) rotate(14) scale(0.66)" />
    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(1006,1148) rotate(-18) scale(0.44)" />
    <use href="#roseWhite" x="-100" y="-100" width="200" height="200"
         transform="translate(1160,1004) rotate(26) scale(0.34)" />
  </g>

  <!-- ============ Acento superior derecho, sobre el marco secundario ============ -->
  <g filter="url(#petalDrop)">
    <use href="#leaf" x="-100" y="-46" width="200" height="92"
         transform="translate(1148,470) rotate(48) scale(0.58)" />
    <use href="#roseBlush" x="-100" y="-100" width="200" height="200"
         transform="translate(1128,528) rotate(-12) scale(0.5)" />
    <use href="#roseCream" x="-100" y="-100" width="200" height="200"
         transform="translate(1172,626) rotate(20) scale(0.34)" />
  </g>

  <!-- ============ Pétalos sueltos en el aire ============ -->
  <g opacity="0.92">
    <use href="#loosePetal" x="-40" y="-50" width="80" height="100"
         transform="translate(452,1178) rotate(38) scale(0.62)" />
    <use href="#loosePetal" x="-40" y="-50" width="80" height="100"
         transform="translate(884,1206) rotate(-24) scale(0.5)" />
    <use href="#loosePetal" x="-40" y="-50" width="80" height="100"
         transform="translate(372,1300) rotate(116) scale(0.4)" opacity="0.8" />
    <use href="#loosePetal" x="-40" y="-50" width="80" height="100"
         transform="translate(940,72) rotate(-64) scale(0.44)" opacity="0.85" />
    <use href="#loosePetal" x="-40" y="-50" width="80" height="100"
         transform="translate(560,132) rotate(28) scale(0.36)" opacity="0.75" />
  </g>
</svg>
