<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 6 / marcos de oro. Va ENCIMA de las fotos.

    ALINEACIÓN: cada marco usa exactamente la misma transformación que Konva
    aplica al PhotoSlot correspondiente —  translate(slot.x, slot.y) rotate(slot.rotation) —
    y dibuja la moldura alrededor del rect (0,0,slot.width,slot.height).
    Si mueves un slot en el .ts, mueve aquí el translate/rotate igual.

      foto-principal   : translate(112,190) rotate(-5)  sobre 630x830, moldura 26
      foto-secundaria  : translate(690,505) rotate(4)   sobre 420x545, moldura 20

    VOLUMEN: la moldura NO es un stroke. Son cuatro caras en inglete, cada una
    con su gradiente perpendicular a su arista, iluminadas desde arriba-izquierda:
    las caras superior e izquierda reciben la luz, las caras derecha e inferior
    quedan en sombra con un rebote en el filo interior. Eso es lo que hace que
    lea como metal con relieve y no como un borde dorado.
  -->
  <defs>
    <!-- Cara iluminada (superior / izquierda): exterior -> interior -->
    <linearGradient id="litT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a17629" />
      <stop offset="8%" stop-color="#e8cf8d" />
      <stop offset="20%" stop-color="#fff8e0" />
      <stop offset="33%" stop-color="#eddba2" />
      <stop offset="48%" stop-color="#d2ae5f" />
      <stop offset="62%" stop-color="#b18636" />
      <stop offset="74%" stop-color="#8e6a26" />
      <stop offset="86%" stop-color="#c9a659" />
      <stop offset="100%" stop-color="#f3e2ab" />
    </linearGradient>
    <linearGradient id="litL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a17629" />
      <stop offset="8%" stop-color="#e3c883" />
      <stop offset="21%" stop-color="#fdf3d6" />
      <stop offset="34%" stop-color="#e7d296" />
      <stop offset="49%" stop-color="#cba85a" />
      <stop offset="63%" stop-color="#ab8132" />
      <stop offset="75%" stop-color="#8a6624" />
      <stop offset="87%" stop-color="#c3a054" />
      <stop offset="100%" stop-color="#eddca4" />
    </linearGradient>

    <!-- Cara en sombra (inferior / derecha): exterior -> interior -->
    <linearGradient id="shdB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7d5719" />
      <stop offset="10%" stop-color="#b89042" />
      <stop offset="24%" stop-color="#d9bd75" />
      <stop offset="40%" stop-color="#b98f3c" />
      <stop offset="58%" stop-color="#916c26" />
      <stop offset="72%" stop-color="#6f5119" />
      <stop offset="86%" stop-color="#a8823a" />
      <stop offset="100%" stop-color="#dcc287" />
    </linearGradient>
    <linearGradient id="shdR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#825c1c" />
      <stop offset="10%" stop-color="#bd9547" />
      <stop offset="24%" stop-color="#dec27b" />
      <stop offset="40%" stop-color="#bd9440" />
      <stop offset="58%" stop-color="#957028" />
      <stop offset="72%" stop-color="#73551b" />
      <stop offset="86%" stop-color="#ad873e" />
      <stop offset="100%" stop-color="#e0c68c" />
    </linearGradient>

    <!-- Oro para ornamentos sueltos -->
    <linearGradient id="ornGold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fff8e2" />
      <stop offset="20%" stop-color="#eed8a0" />
      <stop offset="40%" stop-color="#d3ae5c" />
      <stop offset="54%" stop-color="#fffbe9" />
      <stop offset="70%" stop-color="#bd9548" />
      <stop offset="86%" stop-color="#8d6825" />
      <stop offset="100%" stop-color="#e4c785" />
    </linearGradient>
    <radialGradient id="ornPearl" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#fffdf4" />
      <stop offset="40%" stop-color="#f2e2bb" />
      <stop offset="100%" stop-color="#b58f3e" />
    </radialGradient>

    <!-- Sombra interior proyectada sobre la foto (la hunde dentro del marco) -->
    <linearGradient id="isT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2610" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#3d2610" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="isB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3d2610" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#3d2610" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="isL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2610" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#3d2610" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="isR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#3d2610" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3d2610" stop-opacity="0" />
    </linearGradient>

    <filter id="castA" x="-14%" y="-12%" width="134%" height="130%">
      <feDropShadow dx="16" dy="24" stdDeviation="18"
                    flood-color="#5a3a22" flood-opacity="0.40" />
    </filter>
    <filter id="castB" x="-16%" y="-13%" width="138%" height="132%">
      <feDropShadow dx="13" dy="19" stdDeviation="14"
                    flood-color="#5a3a22" flood-opacity="0.38" />
    </filter>

    <!--
      Ornamento de esquina: dos bandas de acanto que ABRAZAN la esquina
      siguiendo cada arista de la moldura. Antes eran piezas sueltas y se
      leían como dardos flotando junto al marco.
    -->
    <symbol id="cornerOrn" viewBox="0 0 110 110">
      <g fill="url(#ornGold)">
        <path d="M2,2 C40,7 72,24 96,52 C90,54 84,55 78,54
                 C58,32 32,20 6,16 C3,12 2,7 2,2 Z" />
        <path d="M2,2 C7,40 24,72 52,96 C54,90 55,84 54,78
                 C32,58 20,32 16,6 C12,3 7,2 2,2 Z" />
        <path d="M28,28 C46,35 61,48 70,65 C59,56 44,48 28,43 Z" opacity="0.7" />
      </g>
      <circle cx="13" cy="13" r="7.5" fill="url(#ornPearl)" />
      <circle cx="10.5" cy="10.5" r="2.4" fill="#fffdf2" opacity="0.9" />
    </symbol>

    <!-- Copete central del marco principal -->
    <symbol id="crest" viewBox="-70 -60 140 70">
      <g fill="url(#ornGold)">
        <path d="M0,-54 C11,-40 25,-31 46,-27 C25,-23 11,-14 0,0
                 C-11,-14 -25,-23 -46,-27 C-25,-31 -11,-40 0,-54 Z" />
        <path d="M44,-28 C58,-33 68,-31 70,-24 C64,-27 54,-26 44,-24 Z" opacity="0.85" />
        <path d="M-44,-28 C-58,-33 -68,-31 -70,-24 C-64,-27 -54,-26 -44,-24 Z" opacity="0.85" />
      </g>
      <circle cx="0" cy="-27" r="8.5" fill="url(#ornPearl)" />
      <circle cx="-2.6" cy="-30" r="2.8" fill="#fffdf2" opacity="0.9" />
    </symbol>
  </defs>

  <!-- ==================== MARCO PRINCIPAL (foto-principal) ==================== -->
  <g transform="translate(112,190) rotate(-5)">
    <g filter="url(#castA)">
      <!-- caras en inglete: 630x830, moldura 26 -->
      <path d="M-26,-26 L656,-26 L630,0 L0,0 Z" fill="url(#litT)" />
      <path d="M-26,-26 L0,0 L0,830 L-26,856 Z" fill="url(#litL)" />
      <path d="M656,-26 L656,856 L630,830 L630,0 Z" fill="url(#shdR)" />
      <path d="M656,856 L-26,856 L0,830 L630,830 Z" fill="url(#shdB)" />
      <!-- arista exterior y filo de luz interior -->
      <rect x="-26" y="-26" width="682" height="882" fill="none"
            stroke="#77521a" stroke-width="1.6" opacity="0.85" />
      <rect x="1.4" y="1.4" width="627.2" height="827.2" fill="none"
            stroke="#fdf1c8" stroke-width="2.6" opacity="0.62" />
      <rect x="4.6" y="4.6" width="620.8" height="820.8" fill="none"
            stroke="#6d4d18" stroke-width="1.4" opacity="0.55" />
    </g>

    <!-- ornamentos de esquina -->
    <use href="#cornerOrn" x="0" y="0" width="110" height="110"
         transform="translate(-26,-26)" />
    <use href="#cornerOrn" x="0" y="0" width="110" height="110"
         transform="translate(656,-26) scale(-1,1)" />
    <use href="#cornerOrn" x="0" y="0" width="110" height="110"
         transform="translate(-26,856) scale(1,-1)" />
    <use href="#cornerOrn" x="0" y="0" width="110" height="110"
         transform="translate(656,856) scale(-1,-1)" />
    <use href="#crest" x="-70" y="-60" width="140" height="70"
         transform="translate(315,-26)" />

    <!-- la foto se hunde: sombra proyectada del marco sobre la imagen -->
    <rect x="0" y="0" width="630" height="22" fill="url(#isT)" />
    <rect x="0" y="808" width="630" height="22" fill="url(#isB)" />
    <rect x="0" y="0" width="22" height="830" fill="url(#isL)" />
    <rect x="608" y="0" width="22" height="830" fill="url(#isR)" />
  </g>

  <!-- ==================== MARCO SECUNDARIO (foto-secundaria) ==================== -->
  <g transform="translate(690,505) rotate(4)">
    <g filter="url(#castB)">
      <!-- caras en inglete: 420x545, moldura 20 -->
      <path d="M-20,-20 L440,-20 L420,0 L0,0 Z" fill="url(#litT)" />
      <path d="M-20,-20 L0,0 L0,545 L-20,565 Z" fill="url(#litL)" />
      <path d="M440,-20 L440,565 L420,545 L420,0 Z" fill="url(#shdR)" />
      <path d="M440,565 L-20,565 L0,545 L420,545 Z" fill="url(#shdB)" />
      <rect x="-20" y="-20" width="460" height="585" fill="none"
            stroke="#77521a" stroke-width="1.4" opacity="0.85" />
      <rect x="1.2" y="1.2" width="417.6" height="542.6" fill="none"
            stroke="#fdf1c8" stroke-width="2.2" opacity="0.6" />
      <rect x="4" y="4" width="412" height="537" fill="none"
            stroke="#6d4d18" stroke-width="1.2" opacity="0.5" />
    </g>

    <use href="#cornerOrn" x="0" y="0" width="86" height="86"
         transform="translate(-20,-20)" />
    <use href="#cornerOrn" x="0" y="0" width="86" height="86"
         transform="translate(440,-20) scale(-1,1)" />
    <use href="#cornerOrn" x="0" y="0" width="86" height="86"
         transform="translate(-20,565) scale(1,-1)" />
    <use href="#cornerOrn" x="0" y="0" width="86" height="86"
         transform="translate(440,565) scale(-1,-1)" />

    <rect x="0" y="0" width="420" height="18" fill="url(#isT)" />
    <rect x="0" y="527" width="420" height="18" fill="url(#isB)" />
    <rect x="0" y="0" width="18" height="545" fill="url(#isL)" />
    <rect x="402" y="0" width="18" height="545" fill="url(#isR)" />
  </g>
</svg>
