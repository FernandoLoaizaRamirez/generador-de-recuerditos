<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 9 / polvo de oro, destellos y perlas.
    Se concentran donde está la luz (arriba-izquierda), alrededor de las
    mariposas y a lo largo de la diagonal del ramo: las partículas siguen a la
    luz, no se reparten uniformemente. Densidad baja a propósito — el brillo
    tiene que insinuarse, no ensuciar la pieza.
  -->
  <defs>
    <radialGradient id="dust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="0.95" />
      <stop offset="42%" stop-color="#f6dd9f" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#e0bd66" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dustRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4f0" stop-opacity="0.9" />
      <stop offset="46%" stop-color="#f3cfc9" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#e6b4ae" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sparkFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef8" stop-opacity="0.98" />
      <stop offset="34%" stop-color="#fff0c8" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#f2d792" stop-opacity="0.12" />
    </radialGradient>
    <radialGradient id="pearlP" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#fffdf6" />
      <stop offset="44%" stop-color="#f4e6c4" />
      <stop offset="100%" stop-color="#c7a55f" />
    </radialGradient>

    <path id="spark" d="M0,-10 Q1.2,-1.2 10,0 Q1.2,1.2 0,10 Q-1.2,1.2 -10,0
                        Q-1.2,-1.2 0,-10 Z" />
  </defs>

  <!-- ===== Destellos (los pocos puntos realmente brillantes) ===== -->
  <g fill="url(#sparkFill)">
    <use href="#spark" transform="translate(268,142) scale(2.6)" />
    <use href="#spark" transform="translate(118,296) scale(1.7)" />
    <use href="#spark" transform="translate(392,88) scale(1.3)" />
    <use href="#spark" transform="translate(958,318) scale(2.2)" />
    <use href="#spark" transform="translate(1074,196) scale(1.4)" />
    <use href="#spark" transform="translate(824,486) scale(1.6)" opacity="0.9" />
    <use href="#spark" transform="translate(1142,646) scale(1.1)" opacity="0.85" />
    <use href="#spark" transform="translate(206,1096) scale(1.9)" />
    <use href="#spark" transform="translate(86,1246) scale(1.3)" opacity="0.9" />
    <use href="#spark" transform="translate(1096,1128) scale(1.5)" opacity="0.9" />
    <use href="#spark" transform="translate(620,1266) scale(1.0)" opacity="0.8" />
    <use href="#spark" transform="translate(1142,1594) scale(1.2)" opacity="0.8" />
    <use href="#spark" transform="translate(64,1622) scale(0.9)" opacity="0.75" />
  </g>

  <!-- ===== Polvo dorado: cuadrante de luz (arriba-izquierda) ===== -->
  <g fill="url(#dust)">
    <circle cx="196" cy="76" r="3.4" /><circle cx="322" cy="52" r="2.2" />
    <circle cx="88" cy="146" r="2.8" /><circle cx="248" cy="212" r="2.0" />
    <circle cx="46" cy="242" r="3.0" /><circle cx="352" cy="186" r="2.4" />
    <circle cx="146" cy="358" r="2.6" /><circle cx="286" cy="304" r="1.8" />
    <circle cx="62" cy="418" r="2.2" /><circle cx="410" cy="126" r="2.9" />
    <circle cx="466" cy="62" r="1.9" /><circle cx="176" cy="474" r="2.4" />
    <circle cx="30" cy="556" r="2.7" /><circle cx="118" cy="602" r="1.7" />
    <circle cx="524" cy="104" r="2.1" /><circle cx="596" cy="58" r="2.6" />
  </g>

  <!-- ===== Polvo alrededor del racimo superior derecho y la mariposa grande ===== -->
  <g fill="url(#dust)">
    <circle cx="882" cy="196" r="2.8" /><circle cx="1002" cy="242" r="2.1" />
    <circle cx="946" cy="126" r="3.1" /><circle cx="1124" cy="112" r="2.3" />
    <circle cx="1058" cy="392" r="2.6" /><circle cx="908" cy="472" r="2.0" />
    <circle cx="1168" cy="452" r="2.9" /><circle cx="792" cy="332" r="1.8" />
    <circle cx="1006" cy="556" r="2.4" /><circle cx="1148" cy="286" r="1.9" />
    <circle cx="862" cy="614" r="2.2" /><circle cx="1178" cy="742" r="2.5" />
  </g>

  <!-- ===== Polvo en la diagonal inferior izquierda ===== -->
  <g fill="url(#dust)">
    <circle cx="142" cy="1004" r="2.7" /><circle cx="266" cy="1148" r="2.2" />
    <circle cx="58" cy="1122" r="3.0" /><circle cx="192" cy="1272" r="1.9" />
    <circle cx="326" cy="1064" r="2.4" /><circle cx="96" cy="1366" r="2.6" />
    <circle cx="248" cy="1408" r="1.8" /><circle cx="36" cy="1486" r="2.3" />
    <circle cx="358" cy="1252" r="2.0" /><circle cx="152" cy="1552" r="2.5" />
  </g>

  <!-- ===== Polvo rosado disperso (aire tibio) ===== -->
  <g fill="url(#dustRose)">
    <circle cx="642" cy="212" r="2.6" /><circle cx="528" cy="396" r="2.0" />
    <circle cx="736" cy="676" r="2.3" /><circle cx="452" cy="912" r="1.9" />
    <circle cx="1042" cy="838" r="2.5" /><circle cx="614" cy="1128" r="2.1" />
    <circle cx="878" cy="1188" r="2.7" /><circle cx="416" cy="1338" r="1.8" />
    <circle cx="1006" cy="1414" r="2.2" /><circle cx="702" cy="1468" r="1.7" />
    <circle cx="332" cy="1612" r="2.4" /><circle cx="944" cy="1652" r="2.0" />
    <circle cx="566" cy="1718" r="2.2" /><circle cx="1074" cy="1748" r="1.8" />
  </g>

  <!-- ===== Perlas sueltas (peso material, no solo brillo) ===== -->
  <g fill="url(#pearlP)">
    <circle cx="238" cy="252" r="7" /><circle cx="184" cy="292" r="4.6" />
    <circle cx="292" cy="286" r="3.6" />
    <circle cx="1034" cy="472" r="6.4" /><circle cx="1088" cy="512" r="4.2" />
    <circle cx="230" cy="1132" r="6.8" /><circle cx="288" cy="1176" r="4.4" />
    <circle cx="176" cy="1172" r="3.4" />
    <circle cx="1058" cy="1160" r="5.6" /><circle cx="1112" cy="1196" r="3.8" />
    <circle cx="1148" cy="1690" r="5.2" /><circle cx="96" cy="1716" r="4.4" />
  </g>
  <g fill="#fffdf4" opacity="0.85">
    <circle cx="235.6" cy="249" r="2.3" /><circle cx="182" cy="290" r="1.5" />
    <circle cx="1031.6" cy="469" r="2.1" />
    <circle cx="227.6" cy="1129" r="2.2" /><circle cx="286" cy="1174" r="1.5" />
    <circle cx="1055.6" cy="1157" r="1.8" /><circle cx="1145.6" cy="1687" r="1.7" />
  </g>
</svg>
