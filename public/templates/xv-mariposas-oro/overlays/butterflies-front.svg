<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 8 / mariposas delanteras.
    Tres escalas muy distintas (grande cerca, media, pequeñas lejos) para leer
    como planos de profundidad, no como stickers del mismo tamaño. Las alas
    son translúcidas hacia la punta (stop-opacity decreciente), llevan
    nervadura, ribete de polvo dorado y perlas. La sombra proyectada es más
    marcada en las cercanas y casi nula en las lejanas.
  -->
  <defs>
    <radialGradient id="wUp" cx="10%" cy="82%" r="104%">
      <stop offset="0%" stop-color="#c9727f" stop-opacity="0.96" />
      <stop offset="30%" stop-color="#dd9494" stop-opacity="0.92" />
      <stop offset="58%" stop-color="#e8b08f" stop-opacity="0.84" />
      <stop offset="82%" stop-color="#efc98e" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#f7e2b0" stop-opacity="0.44" />
    </radialGradient>
    <radialGradient id="wLo" cx="12%" cy="12%" r="104%">
      <stop offset="0%" stop-color="#bd6675" stop-opacity="0.96" />
      <stop offset="34%" stop-color="#d68a8c" stop-opacity="0.90" />
      <stop offset="66%" stop-color="#e5b293" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#f4dcaa" stop-opacity="0.42" />
    </radialGradient>
    <radialGradient id="wUpGold" cx="10%" cy="82%" r="104%">
      <stop offset="0%" stop-color="#b98b30" stop-opacity="0.95" />
      <stop offset="34%" stop-color="#d8b25c" stop-opacity="0.90" />
      <stop offset="68%" stop-color="#ecd291" stop-opacity="0.76" />
      <stop offset="100%" stop-color="#fbeec6" stop-opacity="0.44" />
    </radialGradient>
    <radialGradient id="wLoGold" cx="12%" cy="12%" r="104%">
      <stop offset="0%" stop-color="#ab7d26" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#cea75f" stop-opacity="0.88" />
      <stop offset="72%" stop-color="#e7cb8b" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#faecc2" stop-opacity="0.40" />
    </radialGradient>
    <linearGradient id="bodyGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f4f22" />
      <stop offset="34%" stop-color="#b78f3f" />
      <stop offset="52%" stop-color="#f2dda2" />
      <stop offset="72%" stop-color="#a67f33" />
      <stop offset="100%" stop-color="#5f421c" />
    </linearGradient>
    <radialGradient id="wPearl" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="52%" stop-color="#f3e3bc" />
      <stop offset="100%" stop-color="#cdae70" />
    </radialGradient>

    <filter id="bfNear" x="-32%" y="-32%" width="168%" height="168%">
      <feDropShadow dx="10" dy="16" stdDeviation="11"
                    flood-color="#5d3a2c" flood-opacity="0.38" />
    </filter>
    <filter id="bfMid" x="-32%" y="-32%" width="168%" height="168%">
      <feDropShadow dx="6" dy="10" stdDeviation="7"
                    flood-color="#5d3a2c" flood-opacity="0.28" />
    </filter>
    <filter id="bfFar" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="4"
                    flood-color="#5d3a2c" flood-opacity="0.18" />
    </filter>

    <symbol id="bfRose" viewBox="-115 -110 230 220">
      <g>
        <g>
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#wUp)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#wLo)" />
          <g stroke="#8f4a58" stroke-width="1.5" fill="none" opacity="0.42">
            <path d="M8,-14 C36,-28 64,-44 86,-56" />
            <path d="M8,-24 C34,-46 58,-62 76,-74" />
            <path d="M7,-32 C28,-60 50,-78 66,-86" />
            <path d="M10,20 C34,28 54,42 62,58" />
            <path d="M9,34 C28,46 42,60 48,74" />
          </g>
          <path d="M4,-38 C34,-96 96,-92 96,-44" fill="none" stroke="#e8c67c"
                stroke-width="2.6" opacity="0.8" />
          <path d="M6,2 C46,4 78,26 68,62" fill="none" stroke="#e8c67c"
                stroke-width="2.2" opacity="0.72" />
          <circle cx="70" cy="-58" r="7" fill="url(#wPearl)" opacity="0.92" />
          <circle cx="46" cy="-70" r="4.2" fill="url(#wPearl)" opacity="0.82" />
          <circle cx="52" cy="46" r="5" fill="url(#wPearl)" opacity="0.86" />
          <path d="M22,-56 C40,-74 62,-80 78,-76" fill="none" stroke="#fff2df"
                stroke-width="2.4" opacity="0.42" />
        </g>
        <g transform="scale(-1,1)">
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#wUp)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#wLo)" />
          <g stroke="#8f4a58" stroke-width="1.5" fill="none" opacity="0.42">
            <path d="M8,-14 C36,-28 64,-44 86,-56" />
            <path d="M8,-24 C34,-46 58,-62 76,-74" />
            <path d="M7,-32 C28,-60 50,-78 66,-86" />
            <path d="M10,20 C34,28 54,42 62,58" />
            <path d="M9,34 C28,46 42,60 48,74" />
          </g>
          <path d="M4,-38 C34,-96 96,-92 96,-44" fill="none" stroke="#e8c67c"
                stroke-width="2.6" opacity="0.8" />
          <path d="M6,2 C46,4 78,26 68,62" fill="none" stroke="#e8c67c"
                stroke-width="2.2" opacity="0.72" />
          <circle cx="70" cy="-58" r="7" fill="url(#wPearl)" opacity="0.92" />
          <circle cx="46" cy="-70" r="4.2" fill="url(#wPearl)" opacity="0.82" />
          <circle cx="52" cy="46" r="5" fill="url(#wPearl)" opacity="0.86" />
        </g>
        <path d="M0,-48 C7,-41 8,-10 6,26 C5,52 2,68 0,76 C-2,68 -5,52 -6,26
                 C-8,-10 -7,-41 0,-48 Z" fill="url(#bodyGold)" />
        <g stroke="#8a6528" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M-2,-46 C-13,-65 -30,-78 -46,-84" />
          <path d="M2,-46 C13,-65 30,-78 46,-84" />
        </g>
        <circle cx="-46" cy="-84" r="3.4" fill="#d9b56a" />
        <circle cx="46" cy="-84" r="3.4" fill="#d9b56a" />
      </g>
    </symbol>

    <symbol id="bfGold" viewBox="-115 -110 230 220">
      <g>
        <g>
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#wUpGold)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#wLoGold)" />
          <g stroke="#7d5a1c" stroke-width="1.5" fill="none" opacity="0.40">
            <path d="M8,-14 C36,-28 64,-44 86,-56" />
            <path d="M8,-24 C34,-46 58,-62 76,-74" />
            <path d="M10,20 C34,28 54,42 62,58" />
          </g>
          <path d="M4,-38 C34,-96 96,-92 96,-44" fill="none" stroke="#fff3ce"
                stroke-width="2.4" opacity="0.72" />
          <circle cx="66" cy="-58" r="6" fill="url(#wPearl)" opacity="0.9" />
          <circle cx="50" cy="44" r="4.4" fill="url(#wPearl)" opacity="0.82" />
        </g>
        <g transform="scale(-1,1)">
          <path d="M4,-38 C34,-96 96,-92 96,-44 C96,-8 44,6 8,-2 Z" fill="url(#wUpGold)" />
          <path d="M6,2 C46,4 78,26 68,62 C58,92 20,84 8,44 Z" fill="url(#wLoGold)" />
          <g stroke="#7d5a1c" stroke-width="1.5" fill="none" opacity="0.40">
            <path d="M8,-14 C36,-28 64,-44 86,-56" />
            <path d="M8,-24 C34,-46 58,-62 76,-74" />
            <path d="M10,20 C34,28 54,42 62,58" />
          </g>
          <path d="M4,-38 C34,-96 96,-92 96,-44" fill="none" stroke="#fff3ce"
                stroke-width="2.4" opacity="0.72" />
          <circle cx="66" cy="-58" r="6" fill="url(#wPearl)" opacity="0.9" />
          <circle cx="50" cy="44" r="4.4" fill="url(#wPearl)" opacity="0.82" />
        </g>
        <path d="M0,-48 C7,-41 8,-10 6,26 C5,52 2,68 0,76 C-2,68 -5,52 -6,26
                 C-8,-10 -7,-41 0,-48 Z" fill="url(#bodyGold)" />
        <g stroke="#8a6528" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M-2,-46 C-13,-65 -30,-78 -46,-84" />
          <path d="M2,-46 C13,-65 30,-78 46,-84" />
        </g>
      </g>
    </symbol>
  </defs>

  <!-- PLANO CERCANO: la mariposa protagonista, sobre el oro del marco secundario -->
  <use href="#bfRose" x="-115" y="-110" width="230" height="220"
       transform="translate(884,392) rotate(-24) scale(1.18)" filter="url(#bfNear)" />

  <!-- PLANO MEDIO -->
  <use href="#bfGold" x="-115" y="-110" width="230" height="220"
       transform="translate(614,236) rotate(18) scale(0.74)" filter="url(#bfMid)" />
  <use href="#bfRose" x="-115" y="-110" width="230" height="220"
       transform="translate(292,1216) rotate(-14) scale(0.64)" filter="url(#bfMid)" />

  <!-- PLANO LEJANO -->
  <use href="#bfRose" x="-115" y="-110" width="230" height="220"
       transform="translate(1016,904) rotate(36) scale(0.44)" filter="url(#bfFar)" />
  <use href="#bfGold" x="-115" y="-110" width="230" height="220"
       transform="translate(142,646) rotate(-42) scale(0.36)" filter="url(#bfFar)" />
  <use href="#bfRose" x="-115" y="-110" width="230" height="220"
       transform="translate(768,1318) rotate(22) scale(0.28)" filter="url(#bfFar)"
       opacity="0.92" />
  <use href="#bfGold" x="-115" y="-110" width="230" height="220"
       transform="translate(1090,286) rotate(-16) scale(0.24)" opacity="0.88" />
  <use href="#bfRose" x="-115" y="-110" width="230" height="220"
       transform="translate(432,84) rotate(30) scale(0.22)" opacity="0.85" />
</svg>
