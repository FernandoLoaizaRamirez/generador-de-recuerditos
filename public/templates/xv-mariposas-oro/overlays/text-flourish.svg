<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 10 / soporte tipográfico. Es la última capa antes de los textos de
    Konva, así que todo lo de aquí queda DEBAJO del texto.

    1) Un velo de luz cálida sobre la zona baja: no es una "placa" con borde
       (eso delataría la plantilla), es un bloom que sube ligeramente el valor
       del fondo para que el texto tenga contraste sin recortar la composición.
    2) Filetes afilados: formas de lente (gruesas en el centro, en punta en los
       extremos), no strokes de grosor constante.

    Alturas pensadas para los textFields del .ts:
       nombre   1170..~1340  -> filete fino en y=1358
       mensaje  1470..~1540  -> filete con medallón en y=1578 (separa el pie)
  -->
  <defs>
    <radialGradient id="textGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="0.40" />
      <stop offset="44%" stop-color="#fff6e6" stop-opacity="0.28" />
      <stop offset="76%" stop-color="#fdf0dd" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#fbecd6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ruleGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a45a" stop-opacity="0.15" />
      <stop offset="22%" stop-color="#b98f3c" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#f0dca4" stop-opacity="0.98" />
      <stop offset="78%" stop-color="#b98f3c" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#c9a45a" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="medalGold" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff8e2" />
      <stop offset="24%" stop-color="#e9d199" />
      <stop offset="46%" stop-color="#cba75c" />
      <stop offset="58%" stop-color="#fffbe9" />
      <stop offset="76%" stop-color="#a87f34" />
      <stop offset="100%" stop-color="#e6c98a" />
    </linearGradient>

    <radialGradient id="medalPearl" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#fffdf6" />
      <stop offset="46%" stop-color="#f2e2ba" />
      <stop offset="100%" stop-color="#bd9748" />
    </radialGradient>
  </defs>

  <!-- 1) Velo de luz sobre el bloque tipográfico -->
  <ellipse cx="600" cy="1420" rx="600" ry="372" fill="url(#textGlow)" />
  <ellipse cx="600" cy="1246" rx="430" ry="150" fill="url(#textGlow)" opacity="0.7" />

  <!-- 2a) Filete fino bajo el nombre (y = 1358) -->
  <g>
    <path d="M416,1358 Q498,1354.6 574,1358 Q498,1361.4 416,1358 Z" fill="url(#ruleGold)" />
    <path d="M784,1358 Q702,1354.6 626,1358 Q702,1361.4 784,1358 Z" fill="url(#ruleGold)" />
    <path d="M600,1350 L607,1358 L600,1366 L593,1358 Z" fill="url(#medalGold)" />
    <circle cx="600" cy="1358" r="2.1" fill="#fffdf2" opacity="0.85" />
  </g>

  <!-- 2b) Filete con medallón que separa el pie del negocio (y = 1578) -->
  <g>
    <path d="M188,1578 Q372,1573.2 546,1578 Q372,1582.8 188,1578 Z" fill="url(#ruleGold)" />
    <path d="M1012,1578 Q828,1573.2 654,1578 Q828,1582.8 1012,1578 Z" fill="url(#ruleGold)" />

    <!-- medallón central: rombo de oro con perla y volutas laterales -->
    <path d="M600,1560 C606,1570 614,1574 626,1578 C614,1582 606,1586 600,1596
             C594,1586 586,1582 574,1578 C586,1574 594,1570 600,1560 Z"
          fill="url(#medalGold)" />
    <circle cx="600" cy="1578" r="5.4" fill="url(#medalPearl)" />
    <circle cx="598.4" cy="1576.2" r="1.8" fill="#fffdf4" opacity="0.9" />
    <path d="M628,1578 C640,1574 650,1575 654,1578 C650,1581 640,1582 628,1578 Z"
          fill="url(#medalGold)" opacity="0.85" />
    <path d="M572,1578 C560,1574 550,1575 546,1578 C550,1581 560,1582 572,1578 Z"
          fill="url(#medalGold)" opacity="0.85" />

    <!-- remates de los extremos -->
    <circle cx="176" cy="1578" r="3" fill="url(#medalPearl)" opacity="0.8" />
    <circle cx="1024" cy="1578" r="3" fill="url(#medalPearl)" opacity="0.8" />
  </g>
</svg>
