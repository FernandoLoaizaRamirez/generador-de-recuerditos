<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    Mariposas de Oro — CAPA 1 / base del caballete.
    La pieza es plegable: la mitad de ARRIBA (0..900) es la escena rosa y la de
    ABAJO (900..1800) la tarjeta marfil. Este fondo casi no se ve — lo tapan
    `underlays/top-scene` y `underlays/bottom-card` — pero es lo que cubre el
    SANGRADO, porque al exportar con sangrado el motor estira este archivo a
    1276x1876. Por eso lleva los dos ambientes y no un color plano.
  -->
  <defs>
    <linearGradient id="topRose" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fdf0f2" />
      <stop offset="40%" stop-color="#f8dde3" />
      <stop offset="100%" stop-color="#eec2cd" />
    </linearGradient>
    <linearGradient id="botIvory" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f7e6ea" />
      <stop offset="26%" stop-color="#fbf4ea" />
      <stop offset="100%" stop-color="#f2e3d6" />
    </linearGradient>
    <radialGradient id="bgBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff6e8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="url(#topRose)" />
  <rect x="0" y="900" width="1200" height="900" fill="url(#botIvory)" />
  <ellipse cx="330" cy="200" rx="620" ry="460" fill="url(#bgBloom)" />
  <ellipse cx="880" cy="1560" rx="560" ry="420" fill="url(#bgBloom)" opacity="0.8" />

  <!-- Marca del doblez: guía sutil, no una línea impresa -->
  <rect x="0" y="896" width="1200" height="8" fill="#d9b8bf" opacity="0.18" />
</svg>
