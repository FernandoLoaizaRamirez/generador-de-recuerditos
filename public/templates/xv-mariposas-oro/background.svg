<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    Mariposas de Oro — CAPA 1 / fondo.
    Papel de estudio: marfil cálido que cae a rosa empolvado, con bandas de
    satén, un bloom de luz desde arriba-izquierda, viñeta suave y grano fino.
    Sin filtros pesados: la suavidad viene de gradientes con alfa.
  -->
  <defs>
    <!-- Base: marfil cálido arriba-izquierda -> rosa empolvado en los bordes -->
    <radialGradient id="bgBase" cx="34%" cy="24%" r="96%">
      <stop offset="0%" stop-color="#fdfaf5" />
      <stop offset="26%" stop-color="#faf2e7" />
      <stop offset="52%" stop-color="#f3e0d6" />
      <stop offset="76%" stop-color="#eaccc7" />
      <stop offset="100%" stop-color="#dcb0b2" />
    </radialGradient>

    <!-- Calidez adicional en la diagonal (evita el look "gradiente plano") -->
    <linearGradient id="bgWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e4" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#fbe9dd" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#d9a9ad" stop-opacity="0.30" />
    </linearGradient>

    <!-- Bloom de luz (foco de estudio arriba-izquierda) -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf4" stop-opacity="0.80" />
      <stop offset="38%" stop-color="#fff6e0" stop-opacity="0.38" />
      <stop offset="72%" stop-color="#ffeed2" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffe8c8" stop-opacity="0" />
    </radialGradient>

    <!-- Rebote cálido inferior derecho (luz de relleno) -->
    <radialGradient id="fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7c9" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#f7d9c4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f0cdbc" stop-opacity="0" />
    </radialGradient>

    <!-- Banda de satén: transparente -> luz -> transparente -->
    <linearGradient id="satin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="42%" stop-color="#fffaf0" stop-opacity="0.30" />
      <stop offset="58%" stop-color="#fffaf0" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="satinDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c69a9c" stop-opacity="0" />
      <stop offset="50%" stop-color="#c69a9c" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#c69a9c" stop-opacity="0" />
    </linearGradient>

    <!-- Viñeta -->
    <radialGradient id="vig" cx="48%" cy="44%" r="74%">
      <stop offset="0%" stop-color="#6b4a44" stop-opacity="0" />
      <stop offset="62%" stop-color="#6b4a44" stop-opacity="0" />
      <stop offset="84%" stop-color="#6b4a44" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#5d3d38" stop-opacity="0.24" />
    </radialGradient>

    <!-- Grano de papel: tile determinista, sin filtros -->
    <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse">
      <g fill="#7a5a52" opacity="0.055">
        <circle cx="12" cy="27" r="1.1" /><circle cx="49" cy="8" r="0.9" />
        <circle cx="88" cy="35" r="1.2" /><circle cx="131" cy="17" r="0.8" />
        <circle cx="166" cy="44" r="1.0" /><circle cx="24" cy="63" r="0.9" />
        <circle cx="71" cy="79" r="1.15" /><circle cx="109" cy="61" r="0.85" />
        <circle cx="152" cy="88" r="1.05" /><circle cx="7" cy="102" r="1.0" />
        <circle cx="43" cy="121" r="0.9" /><circle cx="94" cy="112" r="1.2" />
        <circle cx="138" cy="133" r="0.8" /><circle cx="174" cy="115" r="1.05" />
        <circle cx="19" cy="149" r="1.1" /><circle cx="62" cy="166" r="0.85" />
        <circle cx="104" cy="158" r="1.0" /><circle cx="147" cy="172" r="0.95" />
      </g>
      <g fill="#ffffff" opacity="0.07">
        <circle cx="33" cy="14" r="1.0" /><circle cx="77" cy="46" r="0.9" />
        <circle cx="120" cy="30" r="1.1" /><circle cx="158" cy="66" r="0.85" />
        <circle cx="9" cy="84" r="1.05" /><circle cx="56" cy="97" r="0.9" />
        <circle cx="99" cy="130" r="1.0" /><circle cx="142" cy="104" r="0.95" />
        <circle cx="177" cy="141" r="1.1" /><circle cx="30" cy="176" r="0.9" />
        <circle cx="83" cy="143" r="0.85" /><circle cx="126" cy="163" r="1.0" />
      </g>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="1800" fill="url(#bgBase)" />
  <rect width="1200" height="1800" fill="url(#bgWarm)" />

  <!-- Satén: bandas diagonales muy anchas y suaves -->
  <g transform="rotate(-24 600 900)">
    <rect x="-500" y="-300" width="430" height="2600" fill="url(#satin)" />
    <rect x="120" y="-300" width="300" height="2600" fill="url(#satinDark)" />
    <rect x="620" y="-300" width="520" height="2600" fill="url(#satin)" opacity="0.75" />
    <rect x="1240" y="-300" width="360" height="2600" fill="url(#satinDark)" opacity="0.8" />
  </g>

  <!-- Luz de estudio arriba-izquierda + rebote inferior derecho -->
  <ellipse cx="300" cy="220" rx="760" ry="640" fill="url(#bloom)" />
  <ellipse cx="1020" cy="1560" rx="560" ry="480" fill="url(#fill)" />

  <!-- Grano y viñeta -->
  <rect width="1200" height="1800" fill="url(#grain)" />
  <rect width="1200" height="1800" fill="url(#vig)" />
</svg>
