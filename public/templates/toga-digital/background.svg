<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <linearGradient id="td-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1226" />
      <stop offset="55%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#050710" />
    </linearGradient>
    <radialGradient id="td-halo" cx="50%" cy="12%" r="45%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="td-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8" />
      <stop offset="45%" stop-color="#f5c542" />
      <stop offset="100%" stop-color="#b8862a" />
    </linearGradient>
    <linearGradient id="td-goldh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8862a" />
      <stop offset="50%" stop-color="#ffe89a" />
      <stop offset="100%" stop-color="#b8862a" />
    </linearGradient>
    <filter id="td-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" /></filter>
    <filter id="td-glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" /></filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="1800" fill="url(#td-bg)" />
  <rect width="1200" height="1800" fill="url(#td-halo)" />

  <!-- Circuitos (traza PCB, sutil) -->
  <g fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f5c542" stroke-width="1.6" opacity="0.55">
      <path d="M40 300 H150 V420 H240" /><circle cx="240" cy="420" r="4" fill="#f5c542" stroke="none" />
      <path d="M1160 360 H1040 V250 H930" /><circle cx="930" cy="250" r="4" fill="#f5c542" stroke="none" />
      <path d="M40 1200 H180 V1100" /><circle cx="180" cy="1100" r="4" fill="#f5c542" stroke="none" />
      <path d="M1160 1240 H1010 V1360 H900" /><circle cx="900" cy="1360" r="4" fill="#f5c542" stroke="none" />
    </g>
    <g stroke="#22d3ee" stroke-width="1.4" opacity="0.5">
      <path d="M40 520 H120 V640 H210" /><circle cx="210" cy="640" r="3.5" fill="#22d3ee" stroke="none" />
      <path d="M1160 560 H1070 V680" /><circle cx="1070" cy="680" r="3.5" fill="#22d3ee" stroke="none" />
      <path d="M1160 1120 H1050 V1020 H960" /><circle cx="960" cy="1020" r="3.5" fill="#22d3ee" stroke="none" />
      <path d="M40 1420 H150 V1520" /><circle cx="150" cy="1520" r="3.5" fill="#22d3ee" stroke="none" />
    </g>
  </g>

  <!-- Panel de vidrio -->
  <rect x="56" y="56" width="1088" height="1688" rx="30" fill="#ffffff" opacity="0.028" />
  <rect x="56" y="56" width="1088" height="1688" rx="30" fill="none" stroke="#cfe0ff" stroke-width="1.4" opacity="0.16" />
  <rect x="66" y="66" width="1068" height="1668" rx="24" fill="none" stroke="#f5c542" stroke-width="1" opacity="0.25" />

  <!-- Birrete (toga) -->
  <g>
    <g filter="url(#td-glow)" opacity="0.5">
      <path d="M600 120 L742 168 L600 216 L458 168 Z" fill="#f5c542" />
    </g>
    <!-- corona del birrete -->
    <path d="M556 186 L644 186 L636 220 Q600 236 564 220 Z" fill="#c79a34" />
    <!-- tabla -->
    <path d="M600 120 L742 168 L600 216 L458 168 Z" fill="url(#td-gold)" stroke="#8a6a1e" stroke-width="1.6" />
    <path d="M600 216 L600 216 M458 168 L600 216 L742 168" fill="none" stroke="#fff4cf" stroke-width="1" opacity="0.5" />
    <!-- botón -->
    <circle cx="600" cy="167" r="7" fill="#fff0b8" stroke="#8a6a1e" stroke-width="1" />
    <!-- borla -->
    <path d="M600 167 L724 152" fill="none" stroke="#22d3ee" stroke-width="3.5" />
    <path d="M724 152 L730 226" fill="none" stroke="#f5c542" stroke-width="3.5" />
    <path d="M718 226 L742 226 L736 262 L724 262 Z" fill="#f5c542" />
    <circle cx="730" cy="226" r="6" fill="#22d3ee" />
  </g>

  <!-- Marco doble de la foto (oro + cian) -->
  <g fill="none">
    <rect x="146" y="322" width="908" height="720" rx="16" stroke="#f5c542"
          stroke-width="9" opacity="0.45" filter="url(#td-glow)" />
    <rect x="146" y="322" width="908" height="720" rx="16" stroke="url(#td-goldh)" stroke-width="6" />
    <rect x="158" y="334" width="884" height="696" rx="10" stroke="#22d3ee" stroke-width="2.5" opacity="0.85" />
    <rect x="158" y="334" width="884" height="696" rx="10" stroke="#8af1ff" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Divisor bajo el nombre -->
  <g transform="translate(600,1235)">
    <line x1="-260" y1="0" x2="-46" y2="0" stroke="url(#td-goldh)" stroke-width="3" />
    <line x1="46" y1="0" x2="260" y2="0" stroke="url(#td-goldh)" stroke-width="3" />
    <g filter="url(#td-glow2)"><circle r="5" fill="#22d3ee" /></g>
    <path d="M-30 0 L0 -12 L30 0 L0 12 Z" fill="none" stroke="#f5c542" stroke-width="2" />
    <circle r="3" fill="#8af1ff" />
  </g>

  <!-- Grados académicos: pequeñas estrellas de circuito en las esquinas del panel -->
  <g fill="#f5c542" opacity="0.7">
    <circle cx="96" cy="96" r="3" /><circle cx="1104" cy="96" r="3" />
    <circle cx="96" cy="1704" r="3" /><circle cx="1104" cy="1704" r="3" />
  </g>
</svg>
