<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 6 / soporte tipográfico. Última capa antes de los textos de Konva.

    1) Un velo tibio que calma el veteado del mármol justo donde va el texto.
       No es una placa con borde: si se viera el canto, delataría la plantilla.
    2) Filetes afilados (forma de lente, gruesa en el centro y en punta en los
       extremos) y un divisor con remate botánico que rima con el eucalipto.

    Alturas atadas a los textFields del .ts:
       nombres  1198..~1358  -> filete en y=1382
       mensaje  1472..~1536  -> divisor con remate en y=1570
  -->
  <defs>
    <radialGradient id="veil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfaf2" stop-opacity="0.52" />
      <stop offset="46%" stop-color="#fbf7ed" stop-opacity="0.36" />
      <stop offset="78%" stop-color="#f8f3e6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f6f1e3" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ruleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2a672" stop-opacity="0.12" />
      <stop offset="24%" stop-color="#b0925c" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#e6d6ab" stop-opacity="0.95" />
      <stop offset="76%" stop-color="#b0925c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c2a672" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="sprigGold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f2e6c8" />
      <stop offset="30%" stop-color="#d9be8c" />
      <stop offset="56%" stop-color="#efe1bd" />
      <stop offset="80%" stop-color="#ad8f57" />
      <stop offset="100%" stop-color="#d6c095" />
    </linearGradient>

    <!-- Ramita de oro: dos hojas de eucalipto estilizadas, en espejo -->
    <symbol id="goldLeafPair" viewBox="-46 -22 92 44">
      <g fill="url(#sprigGold)">
        <path d="M-6,0 C-16,-13 -30,-18 -43,-15 C-33,-5 -19,0 -6,0 Z" />
        <path d="M-6,0 C-16,13 -30,18 -43,15 C-33,5 -19,0 -6,0 Z" />
        <path d="M6,0 C16,-13 30,-18 43,-15 C33,-5 19,0 6,0 Z" />
        <path d="M6,0 C16,13 30,18 43,15 C33,5 19,0 6,0 Z" />
      </g>
      <circle cx="0" cy="0" r="4.6" fill="#f4e8cb" />
      <circle cx="-1.4" cy="-1.4" r="1.8" fill="#fffdf6" opacity="0.9" />
    </symbol>
  </defs>

  <!-- 1) Velo sobre el bloque tipográfico -->
  <ellipse cx="600" cy="1420" rx="590" ry="330" fill="url(#veil)" />
  <ellipse cx="600" cy="1240" rx="420" ry="140" fill="url(#veil)" opacity="0.7" />

  <!-- 2a) Filete bajo los nombres (y = 1382) -->
  <g>
    <path d="M406,1382 Q492,1378.6 570,1382 Q492,1385.4 406,1382 Z" fill="url(#ruleG)" />
    <path d="M794,1382 Q708,1378.6 630,1382 Q708,1385.4 794,1382 Z" fill="url(#ruleG)" />
    <path d="M600,1374 L607,1382 L600,1390 L593,1382 Z" fill="url(#sprigGold)" />
  </g>

  <!-- 2b) Divisor con remate botánico (y = 1570) -->
  <g>
    <path d="M216,1570 Q380,1565.4 536,1570 Q380,1574.6 216,1570 Z" fill="url(#ruleG)" />
    <path d="M984,1570 Q820,1565.4 664,1570 Q820,1574.6 984,1570 Z" fill="url(#ruleG)" />
    <use href="#goldLeafPair" x="-46" y="-22" width="92" height="44"
         transform="translate(600,1570)" />
    <circle cx="204" cy="1570" r="2.8" fill="#d6c095" opacity="0.8" />
    <circle cx="996" cy="1570" r="2.8" fill="#d6c095" opacity="0.8" />
  </g>
</svg>
