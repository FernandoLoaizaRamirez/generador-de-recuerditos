<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    Arco de Eucalipto — CAPA 1 / fondo de mármol marfil.
    Deliberadamente frío y sereno frente al rosa cálido de «Mariposas de Oro»:
    aquí manda la piedra, no la luz de estudio. El veteado son cintas afiladas
    (gruesas en el centro, en punta en los extremos), no strokes de grosor
    constante, que es lo que delata un mármol dibujado.
  -->
  <defs>
    <linearGradient id="stone" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fdfbf6" />
      <stop offset="28%" stop-color="#f8f3e9" />
      <stop offset="58%" stop-color="#f2ece0" />
      <stop offset="82%" stop-color="#eae3d5" />
      <stop offset="100%" stop-color="#e1d9c9" />
    </linearGradient>

    <!-- Nubes tonales: lo que hace que la piedra no se lea como papel liso -->
    <radialGradient id="cloudWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#fdf8ee" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#fbf6ec" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloudCool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfc9bb" stop-opacity="0.30" />
      <stop offset="64%" stop-color="#d6d0c2" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#dcd6c9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloudSage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2ccbb" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#cbd4c4" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#d2dacb" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9c1b0" stop-opacity="0.10" />
      <stop offset="26%" stop-color="#b8ae99" stop-opacity="0.55" />
      <stop offset="54%" stop-color="#a99e86" stop-opacity="0.62" />
      <stop offset="78%" stop-color="#bcb29d" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#cdc5b4" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="veinFine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6bfae" stop-opacity="0" />
      <stop offset="40%" stop-color="#b5ab95" stop-opacity="0.34" />
      <stop offset="70%" stop-color="#bdb49f" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#c9c2b1" stop-opacity="0" />
    </linearGradient>

    <pattern id="stoneGrain" width="170" height="170" patternUnits="userSpaceOnUse">
      <g fill="#7d7566" opacity="0.05">
        <circle cx="14" cy="23" r="1.1" /><circle cx="52" cy="9" r="0.8" />
        <circle cx="91" cy="38" r="1.2" /><circle cx="129" cy="16" r="0.9" />
        <circle cx="160" cy="47" r="1.0" /><circle cx="27" cy="66" r="0.9" />
        <circle cx="74" cy="82" r="1.15" /><circle cx="112" cy="63" r="0.85" />
        <circle cx="149" cy="91" r="1.05" /><circle cx="9" cy="105" r="1.0" />
        <circle cx="46" cy="124" r="0.9" /><circle cx="97" cy="115" r="1.2" />
        <circle cx="135" cy="137" r="0.8" /><circle cx="166" cy="119" r="1.05" />
        <circle cx="21" cy="151" r="1.1" /><circle cx="64" cy="163" r="0.85" />
        <circle cx="107" cy="156" r="1.0" /><circle cx="145" cy="168" r="0.95" />
      </g>
      <g fill="#ffffff" opacity="0.075">
        <circle cx="35" cy="13" r="1.0" /><circle cx="80" cy="48" r="0.9" />
        <circle cx="122" cy="31" r="1.1" /><circle cx="155" cy="70" r="0.85" />
        <circle cx="11" cy="87" r="1.05" /><circle cx="58" cy="99" r="0.9" />
        <circle cx="101" cy="132" r="1.0" /><circle cx="140" cy="106" r="0.95" />
        <circle cx="168" cy="145" r="1.1" /><circle cx="31" cy="172" r="0.9" />
      </g>
    </pattern>

    <radialGradient id="vigStone" cx="50%" cy="44%" r="76%">
      <stop offset="0%" stop-color="#584f3f" stop-opacity="0" />
      <stop offset="64%" stop-color="#584f3f" stop-opacity="0" />
      <stop offset="86%" stop-color="#584f3f" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#4c4335" stop-opacity="0.22" />
    </radialGradient>
  </defs>

  <rect width="1200" height="1800" fill="url(#stone)" />

  <!-- Nubes de la piedra -->
  <ellipse cx="330" cy="260" rx="520" ry="420" fill="url(#cloudWarm)" />
  <ellipse cx="980" cy="700" rx="430" ry="380" fill="url(#cloudCool)" />
  <ellipse cx="180" cy="1140" rx="460" ry="400" fill="url(#cloudCool)" opacity="0.8" />
  <ellipse cx="900" cy="1520" rx="480" ry="380" fill="url(#cloudWarm)" opacity="0.9" />
  <ellipse cx="620" cy="900" rx="560" ry="480" fill="url(#cloudWarm)" opacity="0.55" />
  <ellipse cx="1120" cy="180" rx="300" ry="260" fill="url(#cloudSage)" />
  <ellipse cx="70" cy="1660" rx="280" ry="240" fill="url(#cloudSage)" opacity="0.85" />

  <!--
    Veteado. Van como TRAZO, no como cinta rellena: una veta dibujada con dos
    bordes se ensancha sin querer y acaba leyéndose como un brochazo gris.
    El degradado ya lleva alfa 0 en los extremos, así que cada veta se
    desvanece sola por las puntas.
  -->
  <g fill="none" stroke="url(#vein)" stroke-linecap="round">
    <path d="M-30,180 C150,300 292,482 352,702 C402,884 382,1072 302,1252
             C256,1352 190,1452 118,1532" stroke-width="5" />
    <path d="M1240,116 C1086,236 988,406 952,598 C920,774 952,942 1034,1092
             C1086,1188 1154,1270 1234,1334" stroke-width="4.4" opacity="0.9" />
    <path d="M296,1800 C390,1666 512,1574 662,1522 C792,1476 928,1468 1060,1498"
          stroke-width="4" opacity="0.8" />
    <path d="M-20,612 C120,566 268,556 404,586 C520,612 626,668 706,748"
          stroke-width="3.2" opacity="0.72" />
  </g>

  <!-- Ramificaciones: más finas y más cortas, salen de las vetas madre -->
  <g fill="none" stroke="url(#veinFine)" stroke-linecap="round">
    <path d="M116,54 C244,162 332,306 374,472" stroke-width="2.4" />
    <path d="M352,702 C452,752 560,770 672,752" stroke-width="2" />
    <path d="M952,598 C850,648 762,722 702,818" stroke-width="2.2" />
    <path d="M302,1252 C400,1316 520,1348 640,1344" stroke-width="2" />
    <path d="M1034,1092 C1096,1182 1132,1290 1138,1402" stroke-width="2.2" />
    <path d="M662,1522 C608,1612 580,1710 576,1800" stroke-width="1.9" />
    <path d="M-18,884 C92,848 198,846 298,876" stroke-width="2.1" />
    <path d="M1224,936 C1130,984 1060,1052 1016,1136" stroke-width="2" />
    <path d="M404,586 C438,506 456,420 452,330" stroke-width="1.7" opacity="0.8" />
    <path d="M1060,1498 C1116,1560 1152,1636 1166,1718" stroke-width="1.8" opacity="0.8" />
    <path d="M118,1532 C86,1600 68,1676 66,1756" stroke-width="1.7" opacity="0.75" />
  </g>

  <rect width="1200" height="1800" fill="url(#stoneGrain)" />
  <rect width="1200" height="1800" fill="url(#vigStone)" />
</svg>
