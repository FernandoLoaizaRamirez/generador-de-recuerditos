<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!--
    CAPA 2 / eucalipto del plano trasero.
    Va DEBAJO del passe-partout, así que asoma por detrás de sus esquinas y
    ocupa el mármol libre. Perspectiva atmosférica: valores altos, contraste
    bajo y verdes desaturados hacia el gris — lo que está detrás pierde color
    antes que definición.
  -->
  <defs>
    <radialGradient id="lfBackA" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#cdd8c6" />
      <stop offset="58%" stop-color="#b5c3ae" />
      <stop offset="100%" stop-color="#9dae97" />
    </radialGradient>
    <radialGradient id="lfBackB" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#d7dfcf" />
      <stop offset="60%" stop-color="#c2cdba" />
      <stop offset="100%" stop-color="#aab8a3" />
    </radialGradient>
    <radialGradient id="lfBackC" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#c5d2c0" />
      <stop offset="62%" stop-color="#adbca7" />
      <stop offset="100%" stop-color="#94a68f" />
    </radialGradient>

    <symbol id="lfA" viewBox="-34 -30 68 60">
      <ellipse cx="0" cy="0" rx="31" ry="26" fill="url(#lfBackA)" />
      <path d="M-27,3 C-10,-2 12,-3 28,1" fill="none" stroke="#93a58d"
            stroke-width="1.6" opacity="0.45" />
    </symbol>
    <symbol id="lfB" viewBox="-34 -30 68 60">
      <ellipse cx="0" cy="0" rx="30" ry="25" fill="url(#lfBackB)" />
      <path d="M-26,3 C-10,-2 12,-3 27,1" fill="none" stroke="#9cad96"
            stroke-width="1.5" opacity="0.4" />
    </symbol>
    <symbol id="lfC" viewBox="-34 -30 68 60">
      <ellipse cx="0" cy="0" rx="30" ry="26" fill="url(#lfBackC)" />
      <path d="M-26,3 C-10,-2 12,-3 27,1" fill="none" stroke="#899b84"
            stroke-width="1.5" opacity="0.42" />
    </symbol>

    <!-- Rama: tallo curvo + hojas alternas que menguan hacia la punta -->
    <symbol id="sprigBack" viewBox="0 0 330 150">
      <!-- La rama se dibuja al 60 % dentro de su propia caja: a tamaño natural
           las hojas salían de ~120 px y la pieza se leía como selva, no como
           papelería. Encoge hacia el ancla del <use>, así los racimos siguen
           pegados a su esquina sin recolocar nada. -->
      <g transform="scale(0.6)">
      <path d="M8,120 C70,108 140,88 208,60 C252,42 290,30 320,24"
            fill="none" stroke="#94a58d" stroke-width="3.4"
            stroke-linecap="round" opacity="0.72" />
      <use href="#lfA" x="-34" y="-30" width="68" height="60"
           transform="translate(34,132) rotate(38)" />
      <use href="#lfB" x="-34" y="-30" width="68" height="60"
           transform="translate(42,88) rotate(-142) scale(0.95)" />
      <use href="#lfC" x="-34" y="-30" width="68" height="60"
           transform="translate(84,118) rotate(44) scale(0.98)" />
      <use href="#lfA" x="-34" y="-30" width="68" height="60"
           transform="translate(94,74) rotate(-136) scale(0.9)" />
      <use href="#lfB" x="-34" y="-30" width="68" height="60"
           transform="translate(130,104) rotate(40) scale(0.88)" />
      <use href="#lfC" x="-34" y="-30" width="68" height="60"
           transform="translate(140,58) rotate(-140) scale(0.82)" />
      <use href="#lfA" x="-34" y="-30" width="68" height="60"
           transform="translate(178,88) rotate(42) scale(0.78)" />
      <use href="#lfB" x="-34" y="-30" width="68" height="60"
           transform="translate(186,44) rotate(-138) scale(0.72)" />
      <use href="#lfC" x="-34" y="-30" width="68" height="60"
           transform="translate(224,70) rotate(40) scale(0.64)" />
      <use href="#lfA" x="-34" y="-30" width="68" height="60"
           transform="translate(232,30) rotate(-140) scale(0.58)" />
      <use href="#lfB" x="-34" y="-30" width="68" height="60"
           transform="translate(268,54) rotate(38) scale(0.5)" />
      <use href="#lfC" x="-34" y="-30" width="68" height="60"
           transform="translate(276,20) rotate(-142) scale(0.44)" />
      <use href="#lfA" x="-34" y="-30" width="68" height="60"
           transform="translate(310,32) rotate(18) scale(0.36)" />
      </g>
    </symbol>
  </defs>

  <!-- ===== Esquina superior izquierda ===== -->
  <g opacity="0.92">
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-60,-18) rotate(24) scale(1.28)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-40,190) rotate(-14) scale(1.05)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(96,-70) rotate(62) scale(1.0)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-30,392) rotate(38) scale(0.82)" opacity="0.85" />
  </g>

  <!-- ===== Costado derecho, junto al arco ===== -->
  <g opacity="0.9">
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(1250,150) rotate(158) scale(1.2)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(1256,406) rotate(196) scale(1.02)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(1180,-40) rotate(112) scale(0.9)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(1258,660) rotate(172) scale(0.8)" opacity="0.82" />
  </g>

  <!-- ===== Costado izquierdo a media altura ===== -->
  <g opacity="0.85">
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-70,760) rotate(-32) scale(0.98)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-56,980) rotate(16) scale(0.86)" />
  </g>

  <!-- ===== Base: cierra la composición bajo el bloque de texto ===== -->
  <g opacity="0.88">
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(1268,1836) rotate(202) scale(1.26)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(1240,1622) rotate(166) scale(1.02)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-64,1820) rotate(-28) scale(1.18)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(-46,1580) rotate(28) scale(0.94)" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(300,1852) rotate(-52) scale(0.78)" opacity="0.8" />
    <use href="#sprigBack" x="0" y="0" width="330" height="150"
         transform="translate(880,1856) rotate(-118) scale(0.74)" opacity="0.8" />
  </g>
</svg>
