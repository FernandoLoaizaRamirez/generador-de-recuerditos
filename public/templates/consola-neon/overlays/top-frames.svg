       su arista, no de un stroke: un borde plano no da volumen.
       Generado por scripts/build-caballete-assets.mjs -->
  <defs>
    <linearGradient id="bvT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7d53dd"/><stop offset="8%" stop-color="#9cebf7"/><stop offset="20%" stop-color="#c1f3fa"/><stop offset="33%" stop-color="#6fe2f4"/><stop offset="48%" stop-color="#22d3ee"/><stop offset="62%" stop-color="#8457ea"/><stop offset="74%" stop-color="#6845b9"/><stop offset="86%" stop-color="#43daf1"/><stop offset="100%" stop-color="#a7edf8"/></linearGradient><linearGradient id="bvL" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7d53dd"/><stop offset="8%" stop-color="#9cebf7"/><stop offset="20%" stop-color="#c1f3fa"/><stop offset="33%" stop-color="#6fe2f4"/><stop offset="48%" stop-color="#22d3ee"/><stop offset="62%" stop-color="#8457ea"/><stop offset="74%" stop-color="#6845b9"/><stop offset="86%" stop-color="#43daf1"/><stop offset="100%" stop-color="#a7edf8"/></linearGradient><linearGradient id="bvB" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7d53dd"/><stop offset="8%" stop-color="#9cebf7"/><stop offset="20%" stop-color="#c1f3fa"/><stop offset="33%" stop-color="#6fe2f4"/><stop offset="48%" stop-color="#22d3ee"/><stop offset="62%" stop-color="#8457ea"/><stop offset="74%" stop-color="#6845b9"/><stop offset="86%" stop-color="#43daf1"/><stop offset="100%" stop-color="#a7edf8"/></linearGradient><linearGradient id="bvR" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#7d53dd"/><stop offset="8%" stop-color="#9cebf7"/><stop offset="20%" stop-color="#c1f3fa"/><stop offset="33%" stop-color="#6fe2f4"/><stop offset="48%" stop-color="#22d3ee"/><stop offset="62%" stop-color="#8457ea"/><stop offset="74%" stop-color="#6845b9"/><stop offset="86%" stop-color="#43daf1"/><stop offset="100%" stop-color="#a7edf8"/></linearGradient>
    <linearGradient id="isT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3d2610" stop-opacity="0.3"/><stop offset="100%" stop-color="#3d2610" stop-opacity="0"/></linearGradient><linearGradient id="isB" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#3d2610" stop-opacity="0.3"/><stop offset="100%" stop-color="#3d2610" stop-opacity="0"/></linearGradient>
    <linearGradient id="isL" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3d2610" stop-opacity="0.3"/><stop offset="100%" stop-color="#3d2610" stop-opacity="0"/></linearGradient><linearGradient id="isR" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#3d2610" stop-opacity="0.3"/><stop offset="100%" stop-color="#3d2610" stop-opacity="0"/></linearGradient>
