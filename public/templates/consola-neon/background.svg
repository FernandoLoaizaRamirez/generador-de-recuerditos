<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <linearGradient id="cn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a16" />
      <stop offset="45%" stop-color="#05070f" />
      <stop offset="100%" stop-color="#03040a" />
    </linearGradient>
    <radialGradient id="cn-topglow" cx="50%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cn-cyvi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#e451ff" />
    </linearGradient>
    <linearGradient id="cn-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a30" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#080c18" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="cn-rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ee6d6" stop-opacity="0" />
      <stop offset="70%" stop-color="#2ee6d6" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8ff7ec" stop-opacity="0.9" />
    </linearGradient>
    <filter id="cn-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="cn-glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="1800" fill="url(#cn-bg)" />
  <rect width="1200" height="1800" fill="url(#cn-topglow)" />

  <!-- Lluvia de código (matrix), en los márgenes -->
  <g font-family="monospace" font-size="26" fill="#8ff7ec">
    <g opacity="0.22">
      <line x1="64" y1="120" x2="64" y2="470" stroke="url(#cn-rain)" stroke-width="2" />
      <line x1="1136" y1="220" x2="1136" y2="560" stroke="url(#cn-rain)" stroke-width="2" />
      <line x1="1150" y1="1180" x2="1150" y2="1520" stroke="url(#cn-rain)" stroke-width="2" />
      <line x1="52" y1="1240" x2="52" y2="1560" stroke="url(#cn-rain)" stroke-width="2" />
    </g>
    <g opacity="0.28">
      <text x="54" y="150">1<tspan x="54" dy="34">0</tspan><tspan x="54" dy="34">1</tspan><tspan x="54" dy="34">1</tspan><tspan x="54" dy="34">0</tspan></text>
      <text x="1126" y="250">0<tspan x="1126" dy="34">1</tspan><tspan x="1126" dy="34">0</tspan><tspan x="1126" dy="34">0</tspan><tspan x="1126" dy="34">1</tspan></text>
      <text x="1140" y="1210">1<tspan x="1140" dy="34">1</tspan><tspan x="1140" dy="34">0</tspan><tspan x="1140" dy="34">1</tspan></text>
      <text x="42" y="1270">0<tspan x="42" dy="34">1</tspan><tspan x="42" dy="34">1</tspan><tspan x="42" dy="34">0</tspan></text>
    </g>
  </g>

  <!-- Marco de página -->
  <rect x="40" y="40" width="1120" height="1720" rx="24" fill="none"
        stroke="#22d3ee" stroke-width="1.5" opacity="0.28" />

  <!-- Esquinas HUD -->
  <g stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round">
    <g filter="url(#cn-glow2)" opacity="0.7">
      <path d="M60 96 L60 60 L96 60" /><path d="M1104 60 L1140 60 L1140 96" />
      <path d="M60 1704 L60 1740 L96 1740" /><path d="M1140 1704 L1140 1740 L1104 1740" />
    </g>
    <path d="M60 96 L60 60 L96 60" /><path d="M1104 60 L1140 60 L1140 96" />
    <path d="M60 1704 L60 1740 L96 1740" /><path d="M1140 1704 L1140 1740 L1104 1740" />
  </g>

  <!-- Ventana de terminal (aloja la foto) -->
  <rect x="104" y="150" width="992" height="968" rx="20" fill="url(#cn-glass)"
        stroke="#22d3ee" stroke-width="1.5" opacity="0.98" />
  <rect x="104" y="150" width="992" height="968" rx="20" fill="none"
        stroke="#22d3ee" stroke-width="1" opacity="0.35" />
  <!-- barra de título -->
  <path d="M104 170 a20 20 0 0 1 20 -20 h952 a20 20 0 0 1 20 20 v36 h-992 z"
        fill="#16223d" opacity="0.7" />
  <line x1="104" y1="206" x2="1096" y2="206" stroke="#22d3ee" stroke-width="1" opacity="0.3" />
  <g>
    <circle cx="142" cy="178" r="7" fill="#ff5f56" />
    <circle cx="168" cy="178" r="7" fill="#ffbd2e" />
    <circle cx="194" cy="178" r="7" fill="#27c93f" />
  </g>
  <text x="230" y="186" font-family="monospace" font-size="22" letter-spacing="2"
        fill="#8a98b5">graduacion.exe — bash</text>

  <!-- Marco neón de la foto -->
  <g fill="none">
    <rect x="132" y="234" width="936" height="854" rx="12" stroke="#22d3ee"
          stroke-width="8" opacity="0.55" filter="url(#cn-glow)" />
    <rect x="132" y="234" width="936" height="854" rx="12" stroke="#8af1ff" stroke-width="2.5" />
    <rect x="132" y="234" width="936" height="854" rx="12" stroke="#22d3ee" stroke-width="1"
          opacity="0.6" transform="translate(0,0)" />
  </g>

  <!-- Línea de prompt bajo el nombre -->
  <g transform="translate(600,1300)">
    <line x1="-250" y1="0" x2="-40" y2="0" stroke="#22d3ee" stroke-width="2" opacity="0.55" />
    <line x1="40" y1="0" x2="250" y2="0" stroke="#8b5cf6" stroke-width="2" opacity="0.55" />
    <g filter="url(#cn-glow2)"><circle r="6" fill="#22d3ee" /></g>
    <circle r="3.5" fill="#d6faff" />
  </g>
</svg>
