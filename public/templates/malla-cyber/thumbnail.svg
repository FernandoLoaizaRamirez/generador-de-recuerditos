<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <linearGradient id="tmc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b1e" /><stop offset="100%" stop-color="#1e0b32" />
    </linearGradient>
    <linearGradient id="tmc-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6a0" /><stop offset="30%" stop-color="#f5c542" />
      <stop offset="60%" stop-color="#e451ff" /><stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="tmc-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e451ff" /><stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="tmc-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1840" /><stop offset="100%" stop-color="#171029" />
    </linearGradient>
    <filter id="tmc-g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" /></filter>
    <clipPath id="tmc-sunclip"><circle cx="120" cy="112" r="96" /></clipPath>
    <clipPath id="tmc-photoclip"><rect x="40" y="46" width="160" height="150" rx="7" /></clipPath>
  </defs>
  <rect width="240" height="360" fill="url(#tmc-bg)" />

  <!-- Sol -->
  <g clip-path="url(#tmc-sunclip)">
    <circle cx="120" cy="112" r="96" fill="url(#tmc-sun)" />
    <g fill="#171029">
      <rect x="20" y="120" width="200" height="3" /><rect x="20" y="132" width="200" height="4" />
      <rect x="20" y="149" width="200" height="5" /><rect x="20" y="172" width="200" height="7" />
    </g>
  </g>

  <!-- Estrellas -->
  <g fill="#c9d6ff"><circle cx="24" cy="40" r="1.6" /><circle cx="214" cy="54" r="1.6" /><circle cx="40" cy="90" r="1.3" /><circle cx="205" cy="100" r="1.3" /></g>

  <!-- Esquinas -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8">
    <path d="M16 26 L16 16 L26 16" /><path d="M214 16 L224 16 L224 26" />
    <path d="M16 334 L16 344 L26 344" /><path d="M224 334 L224 344 L214 344" />
  </g>

  <!-- Foto (silueta) + marco neón -->
  <g clip-path="url(#tmc-photoclip)">
    <rect x="40" y="46" width="160" height="150" fill="url(#tmc-photo)" />
    <circle cx="120" cy="112" r="28" fill="#3a2456" opacity="0.85" />
    <path d="M78 200 q42 -50 84 0 z" fill="#3a2456" opacity="0.85" />
  </g>
  <g fill="none">
    <rect x="40" y="46" width="160" height="150" rx="7" stroke="url(#tmc-frame)" stroke-width="3.5" opacity="0.6" filter="url(#tmc-g)" />
    <rect x="40" y="46" width="160" height="150" rx="7" stroke="url(#tmc-frame)" stroke-width="1.6" />
  </g>

  <!-- Nombre -->
  <text x="120" y="250" font-family="'Segoe UI',system-ui,sans-serif" font-weight="700"
        font-size="24" letter-spacing="1" fill="#f0d0ff" text-anchor="middle">José Fernando</text>
  <g transform="translate(120,266)">
    <line x1="-52" y1="0" x2="-10" y2="0" stroke="#e451ff" stroke-width="1.5" />
    <line x1="10" y1="0" x2="52" y2="0" stroke="#22d3ee" stroke-width="1.5" />
    <rect x="-3" y="-3" width="6" height="6" transform="rotate(45)" fill="#ffe0ff" />
  </g>
  <rect x="68" y="284" width="104" height="6" rx="3" fill="#b9a3e0" />
  <rect x="58" y="302" width="124" height="7" rx="3.5" fill="#f5c542" />
  <rect x="82" y="320" width="76" height="6" rx="3" fill="#22d3ee" />

  <!-- Mini malla -->
  <g stroke="#22d3ee" opacity="0.55">
    <line x1="30" y1="338" x2="210" y2="338" stroke-width="1.4" />
    <g opacity="0.7" stroke-width="0.8">
      <line x1="120" y1="338" x2="60" y2="356" /><line x1="120" y1="338" x2="120" y2="356" /><line x1="120" y1="338" x2="180" y2="356" />
      <line x1="40" y1="356" x2="200" y2="356" />
    </g>
  </g>
</svg>
