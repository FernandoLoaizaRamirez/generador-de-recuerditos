<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b1e" />
      <stop offset="50%" stop-color="#140a26" />
      <stop offset="100%" stop-color="#1e0b32" />
    </linearGradient>
    <linearGradient id="mc-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6a0" />
      <stop offset="28%" stop-color="#f5c542" />
      <stop offset="58%" stop-color="#e451ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="mc-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e451ff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="mc-sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e451ff" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="mc-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" /></filter>
    <filter id="mc-glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" /></filter>
    <clipPath id="mc-sunclip"><circle cx="600" cy="562" r="470" /></clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="1800" fill="url(#mc-bg)" />

  <!-- Sol synthwave detrás de la foto -->
  <circle cx="600" cy="562" r="560" fill="url(#mc-sunglow)" />
  <g clip-path="url(#mc-sunclip)">
    <circle cx="600" cy="562" r="470" fill="url(#mc-sun)" />
    <!-- líneas de escaneo (más gruesas hacia abajo) -->
    <g fill="#140a26">
      <rect x="120" y="590" width="960" height="8" />
      <rect x="120" y="628" width="960" height="11" />
      <rect x="120" y="672" width="960" height="15" />
      <rect x="120" y="724" width="960" height="20" />
      <rect x="120" y="786" width="960" height="26" />
      <rect x="120" y="860" width="960" height="34" />
      <rect x="120" y="948" width="960" height="44" />
    </g>
  </g>
  <circle cx="600" cy="562" r="470" fill="none" stroke="#ffd76a" stroke-width="2" opacity="0.5" />

  <!-- Estrellas -->
  <g fill="#c9d6ff">
    <circle cx="90" cy="120" r="3" /><circle cx="140" cy="240" r="2" /><circle cx="70" cy="360" r="2.4" />
    <circle cx="1110" cy="150" r="3" /><circle cx="1060" cy="280" r="2" /><circle cx="1130" cy="400" r="2.4" />
    <circle cx="180" cy="90" r="2" /><circle cx="1020" cy="90" r="2" /><circle cx="600" cy="70" r="2.4" />
    <circle cx="300" cy="70" r="2" /><circle cx="900" cy="60" r="2" />
  </g>
  <g fill="#8ff7ec" opacity="0.9">
    <path d="M120 470 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" />
    <path d="M1085 520 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" />
    <path d="M60 640 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" />
  </g>

  <!-- Marco de página -->
  <rect x="40" y="40" width="1120" height="1720" rx="24" fill="none"
        stroke="#e451ff" stroke-width="1.5" opacity="0.25" />

  <!-- Esquinas neón -->
  <g stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M60 96 L60 60 L96 60" /><path d="M1104 60 L1140 60 L1140 96" />
    <path d="M60 1704 L60 1740 L96 1740" /><path d="M1140 1704 L1140 1740 L1104 1740" />
  </g>

  <!-- Marco neón de la foto -->
  <g fill="none">
    <rect x="182" y="167" width="836" height="791" rx="16" stroke="url(#mc-frame)"
          stroke-width="9" opacity="0.6" filter="url(#mc-glow)" />
    <rect x="182" y="167" width="836" height="791" rx="16" stroke="url(#mc-frame)" stroke-width="3.5" />
    <rect x="190" y="175" width="820" height="775" rx="12" stroke="#ffffff" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Divisor bajo el nombre -->
  <g transform="translate(600,1195)">
    <line x1="-250" y1="0" x2="-40" y2="0" stroke="#e451ff" stroke-width="2" opacity="0.6" />
    <line x1="40" y1="0" x2="250" y2="0" stroke="#22d3ee" stroke-width="2" opacity="0.6" />
    <g filter="url(#mc-glow2)"><rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="#e451ff" /></g>
    <rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)" fill="#ffe0ff" />
  </g>

  <!-- Malla Tron (piso) -->
  <g stroke="#22d3ee" stroke-linecap="round">
    <line x1="60" y1="1600" x2="1140" y2="1600" stroke-width="2.5" opacity="0.75" filter="url(#mc-glow2)" />
    <g opacity="0.5" stroke-width="1.6">
      <!-- verticales convergiendo al punto de fuga (600,1600) -->
      <line x1="600" y1="1600" x2="60" y2="1760" /><line x1="600" y1="1600" x2="215" y2="1760" />
      <line x1="600" y1="1600" x2="370" y2="1760" /><line x1="600" y1="1600" x2="490" y2="1760" />
      <line x1="600" y1="1600" x2="600" y2="1760" /><line x1="600" y1="1600" x2="710" y2="1760" />
      <line x1="600" y1="1600" x2="830" y2="1760" /><line x1="600" y1="1600" x2="985" y2="1760" />
      <line x1="600" y1="1600" x2="1140" y2="1760" />
      <!-- horizontales con espaciado creciente -->
      <line x1="150" y1="1640" x2="1050" y2="1640" /><line x1="90" y1="1692" x2="1110" y2="1692" />
      <line x1="55" y1="1752" x2="1145" y2="1752" />
    </g>
  </g>
</svg>
