<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 680" width="575" height="680">
  <!--
    Deluxe Valentina — panel del bloque de textos. Se coloca como overlay en
    455,1007 (575x680), encima de la tarjeta fotorrealista.

    Cumple DOS funciones: tapa el texto que la IA horneó en TarjetaAbajo.png y
    da fondo legible a los textos de Konva. Antes era un rectángulo blanco
    liso, y ese canto plano delataba el montaje sobre una tarjeta que por lo
    demás es fotográfica. Ahora es papel: esquinas redondeadas, filete de oro,
    volutas finas y sombra suave, para que se lea como una cartela pegada.

    Los adornos van SOLO en los márgenes: los textos ocupan de y~68 a y~570
    en coordenadas locales (canvas 1075..1577).
  -->
  <defs>
    <filter id="pnSh" filterUnits="userSpaceOnUse" x="-16" y="-16" width="607" height="712">
      <feDropShadow dx="3" dy="7" stdDeviation="8"
                    flood-color="#6b4a50" flood-opacity="0.26" />
    </filter>

    <linearGradient id="pnPaper" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="46%" stop-color="#fffaf6" />
      <stop offset="100%" stop-color="#fdf0ea" />
    </linearGradient>

    <linearGradient id="pnGold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fff6d8" />
      <stop offset="26%" stop-color="#e6cd8e" />
      <stop offset="48%" stop-color="#c8a04a" />
      <stop offset="60%" stop-color="#fff8e0" />
      <stop offset="82%" stop-color="#a9791f" />
      <stop offset="100%" stop-color="#e8d18a" />
    </linearGradient>

    <radialGradient id="pnPearl" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#fffdf4" />
      <stop offset="44%" stop-color="#f4e2b8" />
      <stop offset="100%" stop-color="#b58f3e" />
    </radialGradient>

    <!-- Voluta de esquina: trazo fino. Rellena se empastaría a este tamaño. -->
    <symbol id="pnCorner" viewBox="0 0 96 96">
      <g fill="none" stroke="url(#pnGold)" stroke-linecap="round">
        <path d="M6,90 C6,48 30,16 74,6" stroke-width="2.2" />
        <path d="M6,90 C28,84 44,68 52,46" stroke-width="1.5" />
        <path d="M52,46 C58,30 70,20 86,16" stroke-width="1.2" />
        <path d="M86,16 C94,14 96,20 92,24 C89,27 84,25 84,21"
              stroke-width="1.2" />
      </g>
      <g fill="url(#pnGold)">
        <path d="M42,60 C52,52 64,48 74,49 C64,56 52,62 42,66 Z" />
      </g>
      <circle cx="74" cy="6" r="3.2" fill="url(#pnPearl)" />
    </symbol>
  </defs>

  <!-- Papel -->
  <g filter="url(#pnSh)">
    <rect x="10" y="10" width="555" height="660" rx="22" fill="url(#pnPaper)" />
  </g>

  <!-- Doble filete -->
  <rect x="10" y="10" width="555" height="660" rx="22" fill="none"
        stroke="url(#pnGold)" stroke-width="2.6" />
  <rect x="24" y="24" width="527" height="632" rx="16" fill="none"
        stroke="url(#pnGold)" stroke-width="1" opacity="0.62" />

  <!-- Volutas en las cuatro esquinas -->
  <use href="#pnCorner" x="0" y="0" width="96" height="96" transform="translate(16,16)" />
  <use href="#pnCorner" x="0" y="0" width="96" height="96" transform="translate(559,16) scale(-1,1)" />
  <use href="#pnCorner" x="0" y="0" width="96" height="96" transform="translate(16,664) scale(1,-1)" />
  <use href="#pnCorner" x="0" y="0" width="96" height="96" transform="translate(559,664) scale(-1,-1)" />

  <!-- Remate superior centrado, sobre el nombre -->
  <g transform="translate(287.5,40)">
    <path d="M-86,0 Q-46,-3.2 -14,0 Q-46,3.2 -86,0 Z" fill="url(#pnGold)" />
    <path d="M86,0 Q46,-3.2 14,0 Q46,3.2 86,0 Z" fill="url(#pnGold)" />
    <path d="M0,-9 L7.5,0 L0,9 L-7.5,0 Z" fill="url(#pnGold)" />
    <circle cx="0" cy="0" r="2.4" fill="#fffdf4" opacity="0.85" />
  </g>

  <!-- Remate inferior, cierra la cartela -->
  <g transform="translate(287.5,640)">
    <path d="M-70,0 Q-38,-2.8 -12,0 Q-38,2.8 -70,0 Z" fill="url(#pnGold)" opacity="0.85" />
    <path d="M70,0 Q38,-2.8 12,0 Q38,2.8 70,0 Z" fill="url(#pnGold)" opacity="0.85" />
    <circle cx="0" cy="0" r="3.6" fill="url(#pnPearl)" />
  </g>
</svg>
